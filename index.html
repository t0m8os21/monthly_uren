<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urenregistratie</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23c0392b' d='M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async onload="onGsiLoad()"></script>
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg:#f4f3ef; --surface:#fff; --border:#e8e6e0;
  --text:#1a1916; --muted:#8a8780; --ink:#3d3b36;
  --accent:#2d5a3d; --accent-light:#e8f0ea;
  --split-bg:#fef8ec; --split-border:#f0c84a; --split-accent:#b07c00;
  --danger:#c0392b; --warn:#d4760a; --success:#2d5a3d;
  --radius:10px; --shadow:0 2px 8px rgba(0,0,0,.07);
}
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:20px 16px 40px; }
.app { max-width:720px; margin:0 auto; }

/* Header & UI Components */
.header { background:var(--text); color:#f4f3ef; border-radius:14px; padding:18px 22px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.header-center { text-align:center; flex:1; }
.header-month { font-size:21px; font-weight:700; letter-spacing:-.5px; }
.header-meta { margin-top:5px; font-size:13px; opacity:.75; display:flex; gap:16px; justify-content:center; align-items:center; flex-wrap:wrap; }
.header-meta strong { opacity:1; font-weight:600; }
.dv { width:1px; height:12px; background:rgba(255,255,255,.25); display:inline-block; }
.nav-btn { background:rgba(255,255,255,.1); border:none; color:#f4f3ef; width:36px; height:36px; border-radius:9px; cursor:pointer; font-size:20px; line-height:36px; text-align:center; flex-shrink:0; }
.nav-btn:hover { background:rgba(255,255,255,.2); }
.tgt-span { cursor:pointer; border-bottom:1px dashed rgba(255,255,255,.4); }
.tgt-input { width:46px; padding:1px 4px; border-radius:5px; border:none; text-align:center; font-weight:700; font-size:13px; font-family:inherit; background:rgba(255,255,255,.18); color:#f4f3ef; }
.view-tabs { display:flex; gap:4px; }
.view-tab { padding:5px 12px; border-radius:7px; border:none; font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; }
.view-tab.active { background:rgba(255,255,255,.25); color:#f4f3ef; }
.view-tab.inactive { background:rgba(255,255,255,.08); color:rgba(255,255,255,.5); }
.panel { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); margin-bottom:14px; overflow:hidden; }
.ptoggle { width:100%; background:none; border:none; padding:11px 16px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; font-family:inherit; font-size:13px; font-weight:600; color:var(--ink); }
.pbody { padding:14px 16px; border-top:1.5px solid var(--border); }
.proj-row { display:grid; grid-template-columns:12px 1fr auto auto auto; gap:10px; align-items:center; padding:8px 10px; border-radius:8px; border:1.5px solid var(--border); background:#fafaf8; margin-bottom:6px; }
.dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; display:inline-block; }
.budget-input { width:58px; padding:5px 6px; border-radius:7px; border:1.5px solid var(--border); text-align:center; font-size:13px; font-weight:600; outline:none; }
.del-btn { background:none; border:none; cursor:pointer; color:#ccc; font-size:15px; }

/* Budget summary table */
.bsum-table { width:100%; border-collapse:collapse; }
.bsum-table th { font-size:10px; font-weight:700; text-transform:uppercase; color:var(--muted); padding:0 8px 8px; text-align:right; }
.bsum-table th:first-child { text-align:left; }
.bsum-table td { padding:7px 8px; border-top:1px solid #f5f4f1; text-align:right; font-size:13px; font-family:'DM Mono',monospace; }
.bsum-table td:first-child { text-align:left; font-family:'DM Sans',sans-serif; font-weight:500; }

/* Week cards */
.weeks { display:flex; flex-direction:column; gap:10px; }
.week-card { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; overflow:hidden; box-shadow:var(--shadow); }
.week-card.split { background:var(--split-bg); border-color:var(--split-border); }
.week-head { padding:12px 14px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; background:#fafaf8; }
.whl { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; }
.whr { display:flex; gap:10px; align-items:center; font-size:13px; }
.week-body { padding:12px 14px; border-top:1.5px solid var(--border); }
.pth { display:grid; grid-template-columns:1fr 90px 1fr; gap:8px; padding-bottom:6px; font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; border-bottom:1.5px solid var(--border); }
.pe { display:grid; grid-template-columns:1fr 90px 1fr; gap:8px; align-items:center; padding:8px 4px; border-bottom:1px solid #f5f4f1; }
.phi { width:70px; padding:6px; border-radius:8px; border:1.5px solid var(--border); text-align:center; font-weight:700; font-family:'DM Mono',monospace; }
.avail-col { text-align:right; }
.avail-main { font-size:14px; font-weight:700; font-family:'DM Mono',monospace; }
.avail-sub { font-size:10px; color:var(--muted); }

/* Day table for split weeks */
.split-scroll { overflow-x:auto; margin-top:10px; }
.sdt { width:100%; border-collapse:collapse; min-width:500px; }
.sdt th { font-size:10px; padding:5px; color:var(--muted); text-align:center; }
.sdt td { padding:4px; text-align:center; }
.dpi { width:45px; padding:4px; border-radius:6px; border:1.5px solid var(--border); text-align:center; font-size:12px; font-family:'DM Mono',monospace; }

.summary { margin-top:14px; padding:16px 20px; background:var(--accent-light); border:1.5px solid #b8d4be; border-radius:12px; display:flex; justify-content:space-between; align-items:center; }
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--text); color:#fff; padding:10px 20px; border-radius:30px; font-size:13px; opacity:0; transition:opacity .3s; z-index:999; }
.toast.show { opacity:1; }
.footer { margin-top:12px; font-size:11px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<script>
const MONTHS=['Januari','Februari','Maart','April','Mei','Juni','Juli','Augustus','September','Oktober','November','December'];
const DAYS=['Ma','Di','Wo','Do','Vr','Za','Zo'];
const COLORS=['#2d5a3d','#1d4ed8','#b07c00','#7c3aed','#be3a2b','#0891b2','#be185d','#4d7c0f'];
const LS_KEY='urenregistratie_v3';
const GCAL_CLIENT_ID='496489196623-41l4utlleu7qs1039seg40uhjc6b99p0.apps.googleusercontent.com';

let S={
  yr:new Date().getFullYear(), mo:new Date().getMonth(),
  target:40, projects:[{id:'p1',name:'Project 1',color:COLORS[0]}],
  budgets:{}, projWeek:{}, projDay:{},
  gcalConnected:false, gcalToken:null, gcalMappings:[],
  view:'month', collapsedWks:{}, showBudgetSummary:true, showPanel:false, showGcal:false
};

function loadState(){
  const raw=localStorage.getItem(LS_KEY);
  if(raw){ const d=JSON.parse(raw); Object.assign(S, d); }
}
function saveState(){ localStorage.setItem(LS_KEY, JSON.stringify(S)); }

// Date Helpers
function getMonday(date){const d=new Date(date);const day=d.getDay();d.setDate(d.getDate()-(day===0?6:day-1));d.setHours(0,0,0,0);return d;}
function fmt(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function mkey(yr,mo){return`${yr}-${String(mo+1).padStart(2,'0')}`;}
function isoWeek(d){const t=new Date(d);t.setHours(0,0,0,0);t.setDate(t.getDate()+4-(t.getDay()||7));return Math.ceil(((t-new Date(t.getFullYear(),0,1))/864e5+1)/7);}

function weeksOfMonth(yr,mo){
  const first=new Date(yr,mo,1),last=new Date(yr,mo+1,0);const weeks=[];let mon=getMonday(first);
  while(mon<=last){
    const days=Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(d.getDate()+i);return d;});
    const inM=days.filter(d=>d.getMonth()===mo&&d.getFullYear()===yr);
    weeks.push({mon:new Date(mon),days,inM,split:inM.length<7,key:fmt(mon),wk:isoWeek(mon)});
    mon.setDate(mon.getDate()+7);
  }
  return weeks;
}

// Calculations
function getProjWkHrs(w,pid){
  if(w.split)return w.inM.reduce((s,d)=>s+(parseFloat(S.projDay[`${fmt(d)}|${pid}`])||0),0);
  return parseFloat(S.projWeek[`${w.key}|${pid}`])||0;
}
function getMonthTotal(weeks){
  return S.projects.reduce((tot,p)=>tot+weeks.reduce((s,w)=>s+getProjWkHrs(w,p.id),0),0);
}
function getProjMonthUsedUpTo(pid,upToIdx,weeks){
  let t=0;
  for(let i=0; i<=upToIdx; i++) t += getProjWkHrs(weeks[i], pid);
  return t;
}
function getRemainingWeeks(weeks){
  const today=new Date(); today.setHours(0,0,0,0);
  const idx = weeks.findIndex(w => {const sun=new Date(w.mon); sun.setDate(sun.getDate()+6); return sun >= today;});
  return idx === -1 ? 0 : weeks.length - idx;
}

// Google Calendar Logic
let gcalTokenClient;
function onGsiLoad(){
  gcalTokenClient=google.accounts.oauth2.initTokenClient({
    client_id:GCAL_CLIENT_ID, scope:'https://www.googleapis.com/auth/calendar.readonly',
    callback: (resp) => { S.gcalToken=resp.access_token; S.gcalConnected=true; saveState(); render(); toast('Gekoppeld ✓'); }
  });
}
function connectGcal(){ gcalTokenClient.requestAccessToken(); }

async function importWeekFromGcal(weekKey){
  const weeks=weeksOfMonth(S.yr, S.mo);
  const w=weeks.find(x=>x.key===weekKey);
  const tMin=w.mon.toISOString(), tMax=new Date(w.mon.getTime()+7*864e5).toISOString();
  
  try {
    const resp=await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${tMin}&timeMax=${tMax}&singleEvents=true`,
      {headers:{Authorization:`Bearer ${S.gcalToken}`}});
    const data=await resp.json();
    let count=0;
    
    // Clear existing for this week and month
    S.projects.forEach(p => {
      if(w.split) w.inM.forEach(d => delete S.projDay[`${fmt(d)}|${p.id}`]);
      else delete S.projWeek[`${weekKey}|${p.id}`];
    });

    (data.items||[]).forEach(ev => {
      const dur = (new Date(ev.end.dateTime) - new Date(ev.start.dateTime))/3600000;
      if(dur > 0){
        const match = S.gcalMappings.find(m => ev.summary.toLowerCase().includes(m.keyword.toLowerCase()));
        if(match){
          const dKey = fmt(new Date(ev.start.dateTime));
          if(w.split){
            if(w.inM.some(d => fmt(d) === dKey)){
              const k = `${dKey}|${match.projId}`;
              S.projDay[k] = (S.projDay[k]||0) + Math.floor(dur*4)/4;
              count++;
            }
          } else {
            const k = `${weekKey}|${match.projId}`;
            S.projWeek[k] = (S.projWeek[k]||0) + Math.floor(dur*4)/4;
            count++;
          }
        }
      }
    });
    saveState(); render(); toast(`${count} items geïmporteerd`);
  } catch(e){ toast('Import mislukt'); }
}

// UI Render functions
function render(){
  const weeks=weeksOfMonth(S.yr, S.mo);
  const cm=mkey(S.yr, S.mo);
  const tot=getMonthTotal(weeks);
  
  document.getElementById('app').innerHTML = `
    <div class="header">
      <button class="nav-btn" onclick="S.mo--; if(S.mo<0){S.mo=11;S.yr--}; render()">‹</button>
      <div class="header-center">
        <div class="header-month">${MONTHS[S.mo]} ${S.yr}</div>
        <div class="header-meta">Totaal: <strong>${tot} u</strong> <span class="dv"></span> Doel: <strong>${S.target} u/wk</strong></div>
      </div>
      <button class="nav-btn" onclick="S.mo++; if(S.mo>11){S.mo=0;S.yr++}; render()">›</button>
    </div>
    
    ${rGcalPanel()}
    ${rProjPanel(cm)}
    ${rBudgetSummary(weeks)}
    
    <div class="weeks">${weeks.map((w,i) => rWeek(w, weeks, i)).join('')}</div>
    <div class="summary">
      <div style="font-weight:700">Maandtotaal ${MONTHS[S.mo]}</div>
      <div style="font-size:24px; font-weight:900; color:var(--success)">${tot} <span style="font-size:14px">uur</span></div>
    </div>
    <div class="footer">Data opgeslagen in browser • Gebruik Chrome/Edge voor GCal</div>
  `;
}

function rGcalPanel(){
  let body = S.showGcal ? `<div class="pbody">
    ${S.gcalConnected ? '<p style="color:green; font-size:12px; margin-bottom:10px">● Agenda verbonden</p>' : `<button class="add-btn" onclick="connectGcal()">Verbind Google Agenda</button>`}
    <div style="font-size:11px; margin-bottom:5px">Regels (Titel bevat → Project):</div>
    ${S.gcalMappings.map((m,i)=>` <div style="font-size:12px; margin-bottom:3px">${m.keyword} → ${S.projects.find(p=>p.id===m.projId)?.name} <button onclick="S.gcalMappings.splice(${i},1);saveState();render()">x</button></div>`).join('')}
    <div style="display:flex; gap:5px; margin-top:5px">
      <input id="kw" placeholder="Titel..." style="flex:1; padding:5px">
      <select id="kp">${S.projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select>
      <button onclick="S.gcalMappings.push({keyword:document.getElementById('kw').value, projId:document.getElementById('kp').value});saveState();render()">+</button>
    </div>
  </div>` : '';
  return `<div class="panel"><button class="ptoggle" onclick="S.showGcal=!S.showGcal;render()">Google Agenda Integratie <span>${S.showGcal?'▲':'▼'}</span></button>${body}</div>`;
}

function rProjPanel(cm){
  let body = S.showPanel ? `<div class="pbody">
    ${S.projects.map(p => `
      <div class="proj-row">
        <div class="dot" style="background:${p.color}"></div>
        <span style="flex:1">${p.name}</span>
        <input class="budget-input" type="number" placeholder="Budget" value="${S.budgets[cm]?.[p.id]||''}" onchange="if(!S.budgets['${cm}'])S.budgets['${cm}']={}; S.budgets['${cm}']['${p.id}']=this.value; saveState(); render()">
      </div>
    `).join('')}
    <button class="add-btn" style="margin-top:10px" onclick="const n=prompt('Naam?'); if(n){S.projects.push({id:'p'+Date.now(), name:n, color:COLORS[S.projects.length%8]}); saveState(); render()}">+ Project toevoegen</button>
  </div>` : '';
  return `<div class="panel"><button class="ptoggle" onclick="S.showPanel=!S.showPanel;render()">Projecten & Budget <span>${S.showPanel?'▲':'▼'}</span></button>${body}</div>`;
}

function rBudgetSummary(weeks){
  const sp=S.projects.filter(p=>parseFloat(S.budgets[mkey(S.yr, S.mo)]?.[p.id])>0);
  if(sp.length===0) return '';
  const remWks=getRemainingWeeks(weeks);
  return `<div class="panel"><div class="pbody"><table class="bsum-table">
    <thead><tr><th>Project</th><th>Budget</th><th>Gebruikt</th><th>Weekdoel*</th></tr></thead>
    <tbody>${sp.map(p=>{
      const bud=parseFloat(S.budgets[mkey(S.yr, S.mo)][p.id]);
      const used=getProjMonthUsedUpTo(p.id, weeks.length-1, weeks);
      return `<tr><td>${p.name}</td><td>${bud}u</td><td>${used}u</td><td style="color:var(--success); font-weight:700">${remWks>0?Math.max(0,Math.floor((bud-getProjMonthUsedUpTo(p.id, weeks.length-remWks-1, weeks))/remWks*4)/4):0}u</td></tr>`;
    }).join('')}</tbody></table></div></div>`;
}

function rWeek(w, weeks, wIdx){
  const isCollapsed = S.collapsedWks[w.key];
  const remWksFromNow = weeks.length - wIdx;
  const head = `<div class="week-head" onclick="S.collapsedWks['${w.key}']=!S.collapsedWks['${w.key}'];render()">
    <div class="whl"><span>Week ${w.wk}</span><span style="color:var(--muted)">${w.inM[0].getDate()} - ${w.inM[w.inM.length-1].getDate()} ${MONTHS[S.mo]}</span></div>
    <div class="whr"><strong>${getTotalWkHrs(w)} u</strong> <span>${isCollapsed?'▼':'▲'}</span></div>
  </div>`;
  if(isCollapsed) return `<div class="week-card">${head}</div>`;
  
  const rows = S.projects.filter(p=>S.budgets[mkey(S.yr,S.mo)]?.[p.id]>0).map(p => {
    const bud = parseFloat(S.budgets[mkey(S.yr,S.mo)][p.id]);
    const usedBefore = getProjMonthUsedUpTo(p.id, wIdx-1, weeks);
    const avail = Math.max(0, Math.floor((bud - usedBefore)/remWksFromNow*4)/4);
    
    return `<div class="pe">
      <div class="pen"><div class="dot" style="background:${p.color}"></div>${p.name}</div>
      <div style="text-align:center">
        ${w.split ? `<strong>${getProjWkHrs(w, p.id)} u</strong>` : `<input class="phi" type="number" step="0.25" value="${S.projWeek[w.key+'|'+p.id]||''}" onchange="S.projWeek['${w.key}|${p.id}']=this.value;saveState();render()">`}
      </div>
      <div class="avail-col"><div class="avail-main">${avail} u/wk</div><div class="avail-sub">vrij: ${bud-getProjMonthUsedUpTo(p.id, wIdx, weeks)}u</div></div>
    </div>`;
  }).join('');

  let dayTable = w.split ? `<div class="split-scroll"><table class="sdt"><tr><th>Dagen</th>${w.days.map(d=>`<th>${DAYS[(d.getDay()+6)%7]}<br>${d.getDate()}</th>`).join('')}</tr>
    ${S.projects.filter(p=>S.budgets[mkey(S.yr,S.mo)]?.[p.id]>0).map(p=>`<tr><td style="font-size:10px">${p.name}</td>${w.days.map(d=>{
      const k=`${fmt(d)}|${p.id}`;
      return `<td><input class="dpi" style="opacity:${d.getMonth()===S.mo?1:0.3}" type="number" step="0.25" value="${S.projDay[k]||''}" onchange="S.projDay['${k}']=this.value;saveState();render()"></td>`;
    }).join('')}</tr>`).join('')}</table></div>` : '';

  return `<div class="week-card ${w.split?'split':''}">
    ${head}
    <div class="week-body">
      <div class="pth"><span>Project</span><span>Uren deze week</span><span>Beschikbaar / week</span></div>
      ${rows}
      ${dayTable}
      ${S.gcalConnected ? `<button class="import-gcal-btn" onclick="importWeekFromGcal('${w.key}')">Importeer uit Agenda</button>` : ''}
    </div>
  </div>`;
}

function getTotalWkHrs(w){ return S.projects.reduce((s,p)=>s+getProjWkHrs(w,p.id),0); }
function toast(m){ const e=document.getElementById('toast'); e.textContent=m; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),2000); }

loadState();
render();
</script>
</body>
</html>
