<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urenregistraties</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23c0392b' d='M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async onload="onGsiLoad()"></script>
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

/* ── Light mode ── */
:root {
  --bg:#f4f3ef; --surface:#fff; --border:#e8e6e0;
  --text:#1a1916; --muted:#8a8780; --ink:#3d3b36;
  --accent:#2d5a3d; --accent-light:#e8f0ea;
  --surface2:#fafaf8; --surface3:#f5f4f1;
  --split-bg:#fef8ec; --split-border:#f0c84a; --split-accent:#b07c00;
  --danger:#c0392b; --warn:#d4760a; --success:#2d5a3d;
  --header-bg:#1a1916; --header-fg:#f4f3ef;
  --input-bg:#fff; --select-bg:#fff;
}

/* ── Dark mode ── */
body.dark {
  --bg:#111010; --surface:#1c1b19; --border:#2e2c28;
  --text:#ede9e2; --muted:#706e68; --ink:#c8c5be;
  --accent:#4d9065; --accent-light:#172318;
  --surface2:#242220; --surface3:#2a2825;
  --split-bg:#1f1c10; --split-border:#8a6a00; --split-accent:#d4960a;
  --danger:#e05545; --warn:#e09030; --success:#4d9065;
  --header-bg:#0e0d0c; --header-fg:#ede9e2;
  --input-bg:#242220; --select-bg:#242220;
}

body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:20px 16px 40px; transition:background .2s,color .2s; }
.app { max-width:720px; margin:0 auto; }

/* ── Header ── */
.header { background:var(--header-bg); color:var(--header-fg); border-radius:14px; padding:18px 22px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.header-center { text-align:center; flex:1; }
.header-month { font-size:21px; font-weight:700; letter-spacing:-.5px; }
.header-meta { margin-top:5px; font-size:13px; opacity:.8; display:flex; gap:14px; justify-content:center; align-items:center; flex-wrap:wrap; }
.header-meta strong { opacity:1; font-weight:600; }
.dv { width:1px; height:12px; background:rgba(255,255,255,.2); display:inline-block; }
.nav-btn { background:rgba(255,255,255,.1); border:none; color:var(--header-fg); width:36px; height:36px; border-radius:9px; cursor:pointer; font-size:20px; line-height:36px; text-align:center; flex-shrink:0; }
.nav-btn:hover { background:rgba(255,255,255,.2); }
.tgt-span { cursor:pointer; border-bottom:1px dashed rgba(255,255,255,.4); }
.tgt-input { width:46px; padding:1px 4px; border-radius:5px; border:none; text-align:center; font-weight:700; font-size:13px; font-family:inherit; background:rgba(255,255,255,.18); color:var(--header-fg); }
.view-tabs { display:flex; gap:4px; }
.view-tab { padding:5px 12px; border-radius:7px; border:none; font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; }
.view-tab.active { background:rgba(255,255,255,.25); color:var(--header-fg); }
.view-tab.inactive { background:rgba(255,255,255,.08); color:rgba(255,255,255,.45); }
.view-tab:hover { background:rgba(255,255,255,.2); color:var(--header-fg); }
.dark-btn { background:rgba(255,255,255,.1); border:none; color:var(--header-fg); width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:16px; line-height:32px; text-align:center; flex-shrink:0; }
.dark-btn:hover { background:rgba(255,255,255,.2); }

/* ── Panels ── */
.panel { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius,10px); margin-bottom:14px; overflow:hidden; }
.ptoggle { width:100%; background:none; border:none; padding:11px 16px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; font-family:inherit; font-size:13px; font-weight:600; color:var(--ink); border-bottom:1.5px solid transparent; }
.ptoggle:hover { background:var(--surface2); }
.ptoggle.open { border-bottom-color:var(--border); }
.ptl { display:flex; align-items:center; gap:8px; }
.pbody { padding:14px 16px; }
.add-row { display:flex; gap:8px; margin-bottom:14px; }
.add-input { flex:1; padding:8px 12px; border-radius:8px; border:1.5px solid var(--border); font-size:13px; font-family:inherit; outline:none; background:var(--input-bg); color:var(--text); }
.add-input:focus { border-color:var(--accent); }
.add-btn { padding:8px 16px; background:var(--ink); color:var(--bg); border:none; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600; font-family:inherit; }
.proj-row { display:grid; grid-template-columns:12px 1fr auto auto auto; gap:10px; align-items:center; padding:8px 10px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface2); margin-bottom:6px; }
.dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; display:inline-block; }
.budget-input { width:58px; padding:5px 6px; border-radius:7px; border:1.5px solid var(--border); text-align:center; font-size:13px; font-weight:600; font-family:'DM Mono',monospace; outline:none; background:var(--input-bg); color:var(--text); }
.del-btn { background:none; border:none; cursor:pointer; color:var(--muted); font-size:15px; padding:0 2px; line-height:1; }
.del-btn:hover { color:var(--danger); }
.data-actions { display:flex; gap:10px; flex-wrap:wrap; }
.data-btn { padding:8px 14px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface2); font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; color:var(--ink); display:flex; align-items:center; gap:6px; }
.data-btn:hover { background:var(--surface3); }
.data-btn.danger { color:var(--danger); }
.data-btn.danger:hover { background:var(--surface3); }
.data-info { margin-top:10px; font-size:12px; color:var(--muted); line-height:1.6; }
select { background:var(--select-bg); color:var(--text); border:1.5px solid var(--border); padding:8px 10px; border-radius:8px; font-family:inherit; font-size:13px; outline:none; }

/* ── Copy panel ── */
.copy-section { margin-top:14px; padding-top:14px; border-top:1.5px solid var(--border); }
.copy-btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.copy-btn { padding:8px 16px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface2); font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; color:var(--ink); transition:all .15s; }
.copy-btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }

/* ── Budget summary ── */
.bsum-table { width:100%; border-collapse:collapse; }
.bsum-table th { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:0 8px 8px; text-align:right; white-space:nowrap; }
.bsum-table th:first-child { text-align:left; }
.bsum-table td { padding:7px 8px; border-top:1px solid var(--border); text-align:right; font-size:13px; font-family:'DM Mono',monospace; white-space:nowrap; color:var(--text); }
.bsum-table td:first-child { text-align:left; font-family:'DM Sans',sans-serif; font-weight:500; }
.bsum-table tr.bsum-total td { border-top:1.5px solid var(--border); font-weight:700; background:var(--surface2); }
.bsum-table tr.bsum-total td:first-child { font-family:'DM Sans',sans-serif; }
.bsum-note { font-size:11px; color:var(--muted); margin-top:8px; }

/* ── Week cards ── */
.weeks { display:flex; flex-direction:column; gap:10px; }
.week-card { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.07); }
.week-card.split { background:var(--split-bg); border-color:var(--split-border); }
.week-card.warning { border-color:#e09030; }
.week-head { padding:9px 14px; display:flex; justify-content:space-between; align-items:center; background:var(--surface2); border-bottom:1.5px solid var(--border); cursor:pointer; user-select:none; }
.week-head:hover { background:var(--surface3); }
.week-card.split .week-head { background:var(--split-bg); border-bottom-color:var(--split-border); }
.week-card.collapsed .week-head { border-bottom:none; }
.whl { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; flex-wrap:wrap; }
.week-num { color:var(--muted); font-weight:500; }
.week-dates { font-size:12px; color:var(--muted); font-weight:400; }
.split-badge { background:var(--split-accent); color:#fff; font-size:10px; padding:2px 8px; border-radius:20px; font-weight:700; }
.warn-badge { font-size:10px; padding:2px 8px; border-radius:20px; font-weight:700; display:inline-flex; align-items:center; gap:3px; background:rgba(224,144,48,.15); color:var(--warn); border:1px solid var(--warn); }
.whr { display:flex; gap:10px; align-items:center; font-size:13px; }
.chevron { font-size:11px; color:var(--muted); transition:transform .2s; }
.week-card.collapsed .chevron { transform:rotate(-90deg); }
.week-body { padding:12px 14px; }

/* Project table */
.pth { display:grid; grid-template-columns:1fr 90px 1fr; gap:8px; padding:0 4px 6px; font-size:10px; font-weight:700; color:var(--muted); letter-spacing:.05em; text-transform:uppercase; border-bottom:1.5px solid var(--border); margin-bottom:4px; }
.pth span:nth-child(2) { text-align:center; }
.pe { display:grid; grid-template-columns:1fr 90px 1fr; gap:8px; align-items:center; padding:7px 4px; border-bottom:1px solid var(--border); }
.pen { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:500; }
.phi { width:68px; padding:7px 6px; border-radius:8px; border-width:1.5px; border-style:solid; text-align:center; font-size:14px; font-weight:700; font-family:'DM Mono',monospace; outline:none; background:var(--input-bg); color:var(--text); }
.warn-row { background:rgba(224,144,48,.07); border-radius:6px; margin:0 -4px; padding:0 4px; }
.avail-col { text-align:right; }
.avail-main { font-size:15px; font-weight:700; font-family:'DM Mono',monospace; line-height:1.2; }
.avail-sub { font-size:11px; color:var(--muted); margin-top:2px; }
.wtb { margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
.bm { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:4px; }
.bt { height:7px; background:var(--surface3); border-radius:4px; overflow:hidden; }
.bf { height:100%; border-radius:4px; transition:width .3s; }
.nb { font-size:11px; color:var(--muted); }

/* Absence row */
.absence-row { margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.absence-label { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; flex-shrink:0; }
.absence-group { display:flex; align-items:center; gap:5px; }
.absence-group label { font-size:11px; color:var(--muted); white-space:nowrap; }
.absence-input { width:44px; padding:4px 5px; border-radius:6px; border:1.5px solid var(--border); text-align:center; font-size:12px; font-weight:600; font-family:'DM Mono',monospace; outline:none; background:var(--input-bg); color:var(--text); }
.absence-input:focus { border-color:var(--muted); }
.absence-effective { font-size:11px; color:var(--muted); margin-left:4px; }

/* Forecast */
.fc-row { margin-top:10px; padding:9px 12px; background:var(--surface2); border-radius:8px; border:1px solid var(--border); }
.fc-main { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
.fc-lbl { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:5px; }
.fc-val { font-size:14px; font-weight:700; font-family:'DM Mono',monospace; white-space:nowrap; }
.fc-chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
.fc-chip { font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; border:1.5px solid var(--border); background:var(--surface); color:var(--ink); white-space:nowrap; display:inline-flex; align-items:center; gap:5px; }
.fc-chip.over { color:var(--danger); border-color:var(--danger); }
.fc-chip.tight { color:var(--warn); border-color:var(--warn); }
.import-gcal-btn { margin-top:10px; display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface2); font-family:inherit; font-size:12px; font-weight:600; color:var(--accent); cursor:pointer; }
.import-gcal-btn:hover { background:var(--surface3); }
.import-gcal-btn:disabled { opacity:.5; cursor:not-allowed; }

/* Split per-day */
.split-sec { margin-top:12px; padding-top:12px; border-top:1.5px dashed var(--split-border); }
.split-sec-title { font-size:11px; font-weight:700; color:var(--split-accent); margin-bottom:10px; text-transform:uppercase; letter-spacing:.05em; }
.split-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.sdt { border-collapse:separate; border-spacing:0; width:100%; min-width:max-content; }
.sdt th { font-size:10px; font-weight:700; color:var(--muted); padding:0 5px 8px; text-align:center; white-space:nowrap; }
.sdt th.pc { text-align:left; padding-left:2px; text-transform:uppercase; letter-spacing:.05em; min-width:90px; }
.sdt th.dm { color:var(--accent); }
.sdt th.do { color:var(--muted); }
.sdt th.tc { color:var(--ink); }
.sdt td { padding:4px; vertical-align:middle; }
.sdt td.pnc { font-size:12px; font-weight:500; padding-left:2px; color:var(--text); }
.sdt td.sc { padding:0 4px; }
.sdt .sep-line { display:block; width:1px; min-height:24px; background:linear-gradient(to bottom,transparent,var(--split-border),transparent); margin:0 auto; }
.sdt tr.tr td { border-top:1.5px solid var(--border); padding-top:6px; font-size:11px; font-weight:700; text-align:center; font-family:'DM Mono',monospace; color:var(--ink); }
.sdt tr.tr td.pnc { text-align:left; color:var(--muted); font-family:'DM Sans',sans-serif; text-transform:uppercase; letter-spacing:.04em; }
.dpi { width:50px; padding:5px 3px; border-radius:7px; border-width:1.5px; border-style:solid; text-align:center; font-size:12px; font-weight:700; font-family:'DM Mono',monospace; outline:none; display:block; margin:0 auto; background:var(--input-bg); color:var(--text); }
.dpi.dim { border-color:var(--border)!important; color:var(--muted)!important; background:var(--surface2)!important; border-style:dashed!important; box-shadow:none!important; }

/* Year */
.chart-toggle-btn { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface); font-family:inherit; font-size:13px; font-weight:600; color:var(--ink); cursor:pointer; }
.chart-toggle-btn:hover { background:var(--surface2); }
.chart-toggle-btn.active { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.year-table-wrap { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; overflow-x:auto; -webkit-overflow-scrolling:touch; box-shadow:0 2px 8px rgba(0,0,0,.07); margin-bottom:14px; }
.year-table { width:max-content; min-width:100%; border-collapse:collapse; font-size:13px; }
.year-table th { padding:9px 14px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); background:var(--surface2); border-bottom:1.5px solid var(--border); text-align:right; white-space:nowrap; }
.year-table th:first-child { text-align:left; }
.year-table th .dot-sm { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:4px; vertical-align:middle; }
.year-table td { padding:9px 14px; border-bottom:1px solid var(--border); text-align:right; font-family:'DM Mono',monospace; white-space:nowrap; color:var(--text); }
.year-table td:first-child { text-align:left; font-family:'DM Sans',sans-serif; font-weight:600; }
.year-table tr:last-child td { border-bottom:none; }
.year-table tr.total-row td { border-top:1.5px solid var(--border); font-weight:700; background:var(--surface2); }
.year-table tr.total-row td:first-child { font-family:'DM Sans',sans-serif; }
.year-table td.cur-month { background:rgba(29,78,216,.08); }
.year-table td.over-bud { color:var(--danger); }
.year-table td.zero { color:var(--muted); }
.chart-section { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,.07); margin-bottom:14px; }
.chart-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
.chart-title { font-size:13px; font-weight:700; }
.proj-filter { display:flex; flex-wrap:wrap; gap:5px; }
.filter-chip { padding:3px 10px; border-radius:20px; border:1.5px solid var(--border); background:var(--surface2); font-size:11px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:5px; color:var(--muted); }
.filter-chip.on { color:var(--ink); }

/* Summary */
.summary { margin-top:14px; padding:16px 20px; background:var(--accent-light); border:1.5px solid var(--accent); border-radius:12px; }
.sc2 { display:flex; flex-wrap:wrap; gap:7px; }
.sc2-chip { display:flex; align-items:center; gap:5px; background:var(--surface); border-radius:20px; padding:4px 11px; font-size:12px; font-weight:500; border:1.5px solid transparent; }

/* Daily verification row */
.day-verify-row { margin-top:10px; padding:10px 12px; background:var(--surface2); border-radius:8px; border:1px solid var(--border); }
.day-verify-title { font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px; }
.day-verify-grid { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:7px; }
.dvc { text-align:center; }
.dvc label { display:block; font-size:10px; color:var(--muted); margin-bottom:1px; }
.dvc .dv-date { font-size:10px; color:var(--muted); margin-bottom:3px; }
.dv-input { width:46px; padding:5px 3px; border-radius:7px; border:1.5px solid var(--border); text-align:center; font-size:12px; font-weight:600; font-family:'DM Mono',monospace; outline:none; background:var(--input-bg); color:var(--text); display:block; }
.dv-input.wknd { opacity:.55; }
.dv-status { font-size:12px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.dv-ok { color:var(--success); font-weight:600; }
.dv-diff { color:var(--warn); font-weight:600; }

/* Toast */
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 20px; border-radius:30px; font-size:13px; font-weight:500; opacity:0; transition:opacity .3s; pointer-events:none; z-index:999; white-space:nowrap; }
.toast.show { opacity:1; }
.empty-msg { text-align:center; color:var(--muted); font-size:13px; padding:8px; }
.footer { margin-top:12px; font-size:11px; color:var(--muted); text-align:center; }
code { font-family:'DM Mono',monospace; background:var(--surface2); padding:1px 5px; border-radius:3px; font-size:11px; color:var(--text); }
</style>
</head>
<body>
<div class="app" id="app"><div style="padding:60px;text-align:center;color:#9ca3af">Laden…</div></div>
<div class="toast" id="toast"></div>
<script>
const MONTHS=['Januari','Februari','Maart','April','Mei','Juni','Juli','Augustus','September','Oktober','November','December'];
const MONTHS_SHORT=['Jan','Feb','Mrt','Apr','Mei','Jun','Jul','Aug','Sep','Okt','Nov','Dec'];
const DAYS=['Ma','Di','Wo','Do','Vr','Za','Zo'];
const COLORS=['#2d5a3d','#1d4ed8','#b07c00','#7c3aed','#be3a2b','#0891b2','#be185d','#4d7c0f'];
const LS_KEY='urenregistratie_v4';
const GCAL_CLIENT_ID='496489196623-41l4utlleu7qs1039seg40uhjc6b99p0.apps.googleusercontent.com';

// ════════ STATE ════════
const _n=new Date();
let S={
  yr:_n.getFullYear(), mo:_n.getMonth(), target:40,
  projects:[{id:'p1',name:'Project 1',color:COLORS[0]}],
  budgets:{}, projWeek:{}, projDay:{},
  absences:{},        // "weekKey|holiday|vacation|sick" -> hours
  gcalConnected:false, gcalToken:null, gcalMappings:[],
  dayTotals:{},       // "YYYY-MM-DD" -> hours (daily total, all projects combined)
  darkMode:false,
  view:'month', chartYr:_n.getFullYear(), showChart:false, chartFilter:{},
  collapsedWks:{}, showBudgetSummary:true,
  showPanel:false, showData:false, showGcal:false, showCopy:false,
  editTarget:false, newName:''
};

// ════════ STORAGE ════════
function loadState(){
  try{
    const raw=localStorage.getItem(LS_KEY); if(!raw)return;
    const d=JSON.parse(raw);
    ['target','projects','budgets','projWeek','projDay','absences','dayTotals',
     'gcalMappings','gcalConnected','darkMode'].forEach(k=>{if(d[k]!==undefined)S[k]=d[k];});
  }catch(e){console.warn(e);}
}
function saveState(){
  try{
    const {target,projects,budgets,projWeek,projDay,absences,dayTotals,gcalMappings,gcalConnected,darkMode}=S;

// ════════ DATE HELPERS ════════
function getMonday(date){const d=new Date(date),day=d.getDay();d.setDate(d.getDate()-(day===0?6:day-1));d.setHours(0,0,0,0);return d;}
function fmt(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function mkey(yr,mo){return`${yr}-${String(mo+1).padStart(2,'0')}`;}
function isoWeek(d){const t=new Date(d);t.setHours(0,0,0,0);t.setDate(t.getDate()+4-(t.getDay()||7));return Math.ceil(((t-new Date(t.getFullYear(),0,1))/864e5+1)/7);}
function weeksOfMonth(yr,mo){
  const first=new Date(yr,mo,1),last=new Date(yr,mo+1,0);const weeks=[];let mon=getMonday(first);
  while(mon<=last){
    const days=Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(d.getDate()+i);return d;});
    const inM=days.filter(d=>d.getMonth()===mo&&d.getFullYear()===yr);
    const outM=days.filter(d=>!(d.getMonth()===mo&&d.getFullYear()===yr));
    weeks.push({mon:new Date(mon),days,inM,outM,split:inM.length<7,key:fmt(mon),wk:isoWeek(mon)});
    mon=new Date(mon);mon.setDate(mon.getDate()+7);
  }
  return weeks;
}

// ════════ CALCULATIONS ════════
function getProjWkHrs(w,pid){
  if(w.split)return w.days.reduce((s,d)=>s+(parseFloat(S.projDay[`${fmt(d)}|${pid}`])||0),0);
  return parseFloat(S.projWeek[`${w.key}|${pid}`])||0;
}
function getProjDayHrs(d,pid){return parseFloat(S.projDay[`${fmt(d)}|${pid}`])||0;}
function getTotalWkHrs(w){return S.projects.reduce((s,p)=>s+getProjWkHrs(w,p.id),0);}
function getMonthWkHrs(w){
  if(w.split)return S.projects.reduce((s,p)=>s+w.inM.reduce((s2,d)=>s2+getProjDayHrs(d,p.id),0),0);
  return getTotalWkHrs(w);
}
function getMonthTotal(weeks){return weeks.reduce((s,w)=>s+getMonthWkHrs(w),0);}
function getProjBudget(pid,yr,mo){return parseFloat(S.budgets[mkey(yr??S.yr,mo??S.mo)]?.[pid])||0;}
function getProjMonthUsedUpTo(pid,upToIdx,weeks){
  let t=0;
  for(let i=0;i<=upToIdx;i++){
    const w=weeks[i];
    if(w.split)t+=w.inM.reduce((s,d)=>s+getProjDayHrs(d,pid),0);
    else t+=parseFloat(S.projWeek[`${w.key}|${pid}`])||0;
  }
  return t;
}
function getAbsenceHrs(weekKey,type){return parseFloat(S.absences[`${weekKey}|${type}`])||0;}
function getTotalAbsenceHrs(weekKey){return['holiday','vacation','sick'].reduce((s,t)=>s+getAbsenceHrs(weekKey,t),0);}
function getEffectiveTarget(weekKey){return Math.max(0,S.target-getTotalAbsenceHrs(weekKey));}
function getOverrunPids(wIdx,weeks){
  const at=new Set();
  S.projects.forEach(p=>{
    const bud=getProjBudget(p.id);if(!bud)return;
    const used=getProjMonthUsedUpTo(p.id,wIdx,weeks);
    if(used>0&&(used/(wIdx+1))*weeks.length>bud*1.05)at.add(p.id);
  });
  return at;
}
function getRemainingWeeks(weeks){
  const today=new Date();today.setHours(0,0,0,0);
  for(let i=0;i<weeks.length;i++){const sun=new Date(weeks[i].mon);sun.setDate(sun.getDate()+6);if(sun>=today)return weeks.length-i;}
  return 0;
}

let gcalTokenClient=null;
window.onGsiLoad=function(){
  if(!window.google)return;

function handleGcalToken(resp){
  if(resp.error){toast('Verbinding mislukt: '+resp.error);return;}

}
function disconnectGcal(){
  if(S.gcalToken&&window.google)google.accounts.oauth2.revoke(S.gcalToken,()=>{});
  S.gcalToken=null;S.gcalConnected=false;saveState();render();toast('Ontkoppeld');
}
function addMapping(){
  const kw=document.getElementById('new-kw')?.value?.trim();
  const pid=document.getElementById('new-kw-proj')?.value;
  if(!kw||!pid){toast('Vul zoekterm en project in');return;}
  S.gcalMappings.push({id:`m${Date.now()}`,keyword:kw,projId:pid});saveState();render();
}
function removeMapping(id){S.gcalMappings=S.gcalMappings.filter(m=>m.id!==id);saveState();render();}
function getEventDurHrs(ev){
  if(ev.start?.date)return 0;if(!ev.start?.dateTime)return 0;
  return(new Date(ev.end.dateTime)-new Date(ev.start.dateTime))/3600000;
}
async function importWeekFromGcal(weekKey){
  if(!S.gcalToken){toast('Verbind eerst met Google Agenda');return;}
  if(!S.gcalMappings.length){toast('Voeg eerst koppelingsregels toe');return;}
  const weeks=weeksOfMonth(S.yr,S.mo);const w=weeks.find(x=>x.key===weekKey);if(!w)return;
  const btn=document.querySelector(`[data-import="${weekKey}"]`);
  if(btn){btn.textContent='⏳ Laden…';btn.disabled=true;}
  const tMin=encodeURIComponent(w.mon.toISOString());
  const tMax=encodeURIComponent(new Date(w.mon.getTime()+7*864e5).toISOString());
  let events=[];
  try{
    const resp=await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${tMin}&timeMax=${tMax}&singleEvents=true&orderBy=startTime&maxResults=250`,{headers:{Authorization:`Bearer ${S.gcalToken}`}});
    if(resp.status===401){S.gcalConnected=false;S.gcalToken=null;saveState();render();toast('Sessie verlopen, verbind opnieuw');return;}
    events=(await resp.json()).items||[];
  }catch(e){toast('Fout bij ophalen agenda');render();return;}
  let matched=0;const dayHrs={},wkHrs={};
  for(const ev of events){
    const title=(ev.summary||'').toLowerCase();
    const rule=S.gcalMappings.find(m=>title.includes(m.keyword.toLowerCase()));
    if(!rule)continue;const dur=floorQ(getEventDurHrs(ev));if(dur<=0)continue;
    matched++;
    if(w.split){const day=ev.start.dateTime?fmt(new Date(ev.start.dateTime)):ev.start.date;const k=`${day}|${rule.projId}`;dayHrs[k]=(dayHrs[k]||0)+dur;}
    else wkHrs[rule.projId]=(wkHrs[rule.projId]||0)+dur;
  }
  if(!matched){toast('Geen overeenkomsten gevonden');render();return;}
  if(w.split)Object.assign(S.projDay,dayHrs);
  else Object.entries(wkHrs).forEach(([pid,hrs])=>{S.projWeek[`${weekKey}|${pid}`]=hrs;});
  saveState();render();toast(`${matched} event${matched!==1?'s':''} geïmporteerd ✓`);
}

let _tt;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),2800);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function ha(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}
function sortedProjects(){return[...S.projects].sort((a,b)=>a.name.localeCompare(b.name,'nl'));}
function floorQ(v){return Math.floor(v*4)/4;}
function fmtH(v){const n=Number(v);if(isNaN(n))return'–';return n%1===0?n.toFixed(0):n.toFixed(2).replace(/\.?0+$/,'');}

// ════════ BUDGET SUMMARY ════════
function rBudgetSummary(weeks){
  const sp=sortedProjects().filter(p=>getProjBudget(p.id)>0);
  if(!sp.length)return'';
  const remWks=getRemainingWeeks(weeks);
  const totalUsed=getMonthTotal(weeks);
  const totalBud=sp.reduce((s,p)=>s+getProjBudget(p.id),0);
  const totalRem=totalBud-totalUsed;
  // Effective monthly capacity accounts for absences already logged
  const totalAbsenceThisMonth=weeks.reduce((s,w)=>s+getTotalAbsenceHrs(w.key),0);

  let body='';
  if(S.showBudgetSummary){
    const rows=sp.map(p=>{
      const bud=getProjBudget(p.id);
      const used=getProjMonthUsedUpTo(p.id,weeks.length-1,weeks);
      const rem=bud-used;const ppw=remWks>0?floorQ(rem/remWks):null;
      const rc=rem<0?'var(--danger)':ppw!==null&&ppw<(bud/weeks.length)*.5?'var(--warn)':'var(--success)';
      return`<tr>
        <td><div style="display:flex;align-items:center;gap:7px"><div class="dot" style="background:${p.color}"></div>${esc(p.name)}</div></td>
        <td style="color:var(--muted)">${fmtH(bud)} u</td>
        <td>${fmtH(used)} u</td>
        <td style="color:${rem<0?'var(--danger)':'var(--text)'}">${fmtH(rem)} u</td>
        <td style="font-weight:700;color:${rc}">${ppw!==null?fmtH(ppw)+' u/wk':'–'}</td>
      </tr>`;
    }).join('');
    const absNote=totalAbsenceThisMonth>0?` · ${fmtH(totalAbsenceThisMonth)} u afwezigheid verrekend`:'';
    body=`<div class="pbody" style="padding-bottom:12px">
      <table class="bsum-table">
        <thead><tr><th>Project</th><th>Budget</th><th>Gebruikt</th><th>Resterend</th><th>Per week*</th></tr></thead>
        <tbody>${rows}
          <tr class="bsum-total">
            <td>Totaal</td>
            <td style="color:var(--muted)">${fmtH(totalBud)} u</td>
            <td>${fmtH(totalUsed)} u</td>
            <td style="color:${totalRem<0?'var(--danger)':'var(--text)'}">${fmtH(totalRem)} u</td>
            <td style="font-weight:700;color:${totalRem<0?'var(--danger)':'var(--success)'}">${remWks>0?fmtH(floorQ(totalRem/remWks))+' u/wk':'–'}</td>
          </tr>
        </tbody>
      </table>
      <div class="bsum-note">* Afgerond naar beneden op kwartier · ${remWks} resterende week${remWks!==1?'en':''}${absNote}</div>
    </div>`;
  }
  return`<div class="panel" style="border-color:var(--accent)">
    <button class="ptoggle ${S.showBudgetSummary?'open':''}" onclick="S.showBudgetSummary=!S.showBudgetSummary;render()" style="${S.showBudgetSummary?'background:var(--accent-light)':''}">
      <div class="ptl">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <span style="color:var(--success);font-weight:700">Budgetoverzicht — ${MONTHS[S.mo]}</span>
        <span style="font-size:11px;color:var(--muted);font-weight:400">${fmtH(totalUsed)} / ${fmtH(totalBud)} u gebruikt</span>
      </div><span>${S.showBudgetSummary?'▲':'▼'}</span>
    </button>${body}
  </div>`;
}

          <input class="budget-input" style="border-color:${ha(p.color,.3)};color:${p.color}" type="number" min="0" step="0.25" value="${S.budgets[cm]?.[p.id]??''}" placeholder="0" onchange="setBudget('${p.id}','${cm}',this.value)">
          <span style="font-size:12px;color:var(--muted)">u</span>
        </div>
        <span style="font-size:12px;font-weight:500;min-width:90px;text-align:right;color:${rem<0?'var(--danger)':rem<bud*.1?'var(--warn)':'var(--success)'}">
          ${bud>0?`${fmtH(used)} / ${fmtH(bud)} u`:'–'}
        </span>
        <button class="del-btn" onclick="removeProject('${p.id}')">✕</button>
      </div>`;
    }).join('');

    // Copy section
    const srcBud=S.budgets[cm]||{};
    const activeCount=S.projects.filter(p=>(parseFloat(srcBud[p.id])||0)>0).length;
    const copySection=`<div class="copy-section">
      <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Kopieer budgetten naar ${nextMonthName()}</div>
      <div class="copy-btns">
        <button class="copy-btn" onclick="copyBudgets('all')">Alle ${S.projects.length} projecten</button>
        <button class="copy-btn" onclick="copyBudgets('active')">Alleen met budget deze maand (${activeCount})</button>
      </div>
    </div>`;

    body=`<div class="pbody">
      <div class="add-row">
        <input class="add-input" id="npi" type="text" placeholder="Naam nieuw project…" oninput="S.newName=this.value" onkeydown="if(event.key==='Enter')addProject()">
        <button class="add-btn" onclick="addProject()">+ Toevoegen</button>
      </div>
      ${!S.projects.length?`<div class="empty-msg">Nog geen projecten.</div>`:rows}
      ${S.projects.length?copySection:''}
    </div>`;
  }
  return`<div class="panel">
    <button class="ptoggle ${S.showPanel?'open':''}" onclick="S.showPanel=!S.showPanel;render()">
      <div class="ptl">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Projecten &amp; Maandbudget — ${MONTHS[S.mo]}
      </div><span>${S.showPanel?'▲':'▼'}</span>
    </button>${body}
  </div>`;
}

// ════════ WEEK CARD ════════
function rWeek(w,weeks,wIdx){
  const collapsed=!!S.collapsedWks[w.key];
  const totalHrs=getTotalWkHrs(w);
  const absHrs=getTotalAbsenceHrs(w.key);
  const effTarget=getEffectiveTarget(w.key);
  const rem=effTarget-totalHrs;
  const pct=Math.min(100,effTarget>0?(totalHrs/effTarget)*100:0);
  const rc=rem<0?'var(--danger)':rem===0?'var(--success)':'var(--ink)';
  const dr=`${w.inM[0].getDate()} – ${w.inM[w.inM.length-1].getDate()} ${MONTHS[S.mo]}`;
  const rs=rem>0?`Nog ${fmtH(rem)} u`:rem<0?`${fmtH(Math.abs(rem))} u over`:'✓ Compleet';
  const overrunPids=getOverrunPids(wIdx,weeks);
  const hasOverrun=overrunPids.size>0;
  const remWks=weeks.length-(wIdx+1);
  const visProjects=sortedProjects().filter(p=>getProjBudget(p.id)>0);

  const head=`<div class="week-head" onclick="toggleWk('${w.key}')">
    <div class="whl">
      <span class="week-num">Week ${w.wk}</span>
      <span class="week-dates">${dr}</span>
      ${w.split?`<span class="split-badge">✂ Gesplitst</span>`:''}
      ${absHrs>0?`<span style="font-size:10px;color:var(--muted);background:var(--surface2);padding:2px 8px;border-radius:20px;border:1px solid var(--border)">${fmtH(absHrs)} u afwezigheid</span>`:''}
      ${hasOverrun?`<span class="warn-badge">⚠ dreigt over budget</span>`:''}
    </div>
    <div class="whr">
      <span style="color:var(--muted);font-size:13px">Totaal: <strong style="color:var(--ink)">${fmtH(totalHrs)} u</strong></span>
      <span style="font-weight:700;color:${rc}">${rs}</span>
      <span class="chevron">▼</span>
    </div>
  </div>`;

  if(collapsed)return`<div class="week-card ${w.split?'split':''} ${hasOverrun?'warning':''} collapsed">${head}</div>`;

  // Project rows
  let pc='';
  if(!visProjects.length){
    pc=`<div class="empty-msg">${!S.projects.length?'Voeg projecten toe via het paneel hierboven.':'Stel een maandbudget in om uren in te vullen.'}</div>`;
  } else {
    const thead=`<div class="pth"><span>Project</span><span>Uren week</span><span>Beschikbaar / week</span></div>`;
    const rows=visProjects.map(p=>{
      const wkH=getProjWkHrs(w,p.id);const used=getProjMonthUsedUpTo(p.id,wIdx,weeks);
      const bud=getProjBudget(p.id);const rb=bud-used;
      const ppw=bud>0&&remWks>0?floorQ(rb/remWks):null;
      const isOver=overrunPids.has(p.id);
      const c3=rb<0?'var(--danger)':ppw!==null&&ppw<(bud/weeks.length)*.5?'var(--warn)':'var(--success)';
      const inp=w.split
        ?`<span style="font-size:14px;font-weight:700;font-family:'DM Mono',monospace;color:${p.color}">${wkH>0?fmtH(wkH):'–'} u</span>`
        :`<input class="phi" style="border-color:${ha(p.color,.25)};color:${p.color};background:var(--input-bg)"
            type="number" min="0" step="0.25" value="${S.projWeek[`${w.key}|${p.id}`]??''}" placeholder="0"
            onchange="setProjHrs('${w.key}','${p.id}',this.value)"
            onfocus="this.style.boxShadow='0 0 0 3px ${ha(p.color,.2)}'" onblur="this.style.boxShadow='none'">`;
      return`<div class="pe ${isOver?'warn-row':''}">
        <div class="pen"><div class="dot" style="background:${p.color}"></div><span>${esc(p.name)}</span></div>
        <div style="text-align:center">${inp}</div>
        <div class="avail-col">${bud>0
          ?`<div class="avail-main" style="color:${isOver?'var(--warn)':c3}">
              ${ppw!==null?fmtH(ppw)+' u/wk':rb>=0?fmtH(rb)+' u':fmtH(Math.abs(rb))+' te veel'}
              ${isOver?`<span style="font-size:12px">⚠</span>`:''}
            </div>
            <div class="avail-sub">${rb>=0?fmtH(rb)+' u resterend':fmtH(Math.abs(rb))+' over budget'}${remWks>0?' · '+remWks+' wk':''}</div>`
          :`<span class="nb">Geen budget</span>`}
        </div>
      </div>`;
    }).join('');
    const tb=`<div class="wtb">
      <div class="bm"><span>${fmtH(totalHrs)} u van ${fmtH(effTarget)} u${absHrs>0?` (weekdoel ${S.target} – ${fmtH(absHrs)} afwezigheid)`:' weekdoel'}</span><span>${pct.toFixed(0)}%</span></div>
      <div class="bt"><div class="bf" style="width:${pct}%;background:${totalHrs>=effTarget?'var(--success)':'var(--ink)'}"></div></div>
    </div>`;
    pc=thead+rows+tb;
  }

  // Daily hours verification (non-split weeks only — split weeks already have per-day project table)
  const dayVerifyRow = !w.split ? (()=>{
    const inputs=w.days.map((d,i)=>{
      const dk=fmt(d),isWknd=i>=5,v=S.dayTotals[dk]??'';
      return`<div class="dvc">
        <label>${DAYS[i]}</label>
        <div class="dv-date">${d.getDate()}</div>
        <input class="dv-input ${isWknd?'wknd':''}" type="number" min="0" step="0.25"
          value="${v}" placeholder="0"
          onchange="setDayTotal('${dk}',this.value)"
          onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'">
      </div>`;
    }).join('');
    const daySum=w.days.reduce((s,d)=>s+(parseFloat(S.dayTotals[fmt(d)])||0),0);
    const projTotal=getTotalWkHrs(w);
    const diff=Math.round((daySum-projTotal)*100)/100;
    const hasData=daySum>0||projTotal>0;
    const status=!hasData?''
      :Math.abs(diff)<0.01?`<span class="dv-ok">✓ Klopt (${fmtH(daySum)} u)</span>`
      :`<span class="dv-diff">⚠ Verschil: ${diff>0?'+':''}${fmtH(diff)} u</span>
        <span style="font-size:11px;color:var(--muted)">Dag ${fmtH(daySum)} u · Project ${fmtH(projTotal)} u</span>`;
    return`<div class="day-verify-row">
      <div class="day-verify-title">Dagelijkse uren — verificatie</div>
      <div class="day-verify-grid">${inputs}</div>
      ${status?`<div class="dv-status">${status}</div>`:''}
    </div>`;
  })() : '';

  // Absence inputs
  const absence=`<div class="absence-row">
    <span class="absence-label">Afwezigheid</span>
    <div class="absence-group">
      <span>🏛</span><label>Feestdag</label>
      <input class="absence-input" type="number" min="0" step="0.25" value="${S.absences[`${w.key}|holiday`]??''}" placeholder="0"
        onchange="setAbsence('${w.key}','holiday',this.value)"> u
    </div>
    <div class="absence-group">
      <span>✈</span><label>Vakantie</label>
      <input class="absence-input" type="number" min="0" step="0.25" value="${S.absences[`${w.key}|vacation`]??''}" placeholder="0"
        onchange="setAbsence('${w.key}','vacation',this.value)"> u
    </div>
    <div class="absence-group">
      <span>🤒</span><label>Ziek</label>
      <input class="absence-input" type="number" min="0" step="0.25" value="${S.absences[`${w.key}|sick`]??''}" placeholder="0"
        onchange="setAbsence('${w.key}','sick',this.value)"> u
    </div>
    ${absHrs>0?`<span class="absence-effective">→ Effectief weekdoel: ${fmtH(effTarget)} u</span>`:''}
  </div>`;

  // Forecast
  const mBud=S.target*weeks.length;
  const usedSoFar=weeks.slice(0,wIdx+1).reduce((s,wk)=>s+getMonthWkHrs(wk),0);
  const remMonth=mBud-usedSoFar;const remWksF=weeks.length-(wIdx+1);const perWk=remWksF>0?remMonth/remWksF:null;
  let fcHtml='';
  if(S.projects.length){
    const vc=perWk===null?'var(--muted)':perWk<0?'var(--danger)':perWk<S.target*.6?'var(--warn)':'var(--success)';
    const mainLine=remWksF===0
      ?`<span class="fc-lbl">Laatste week</span><span class="fc-val" style="color:var(--muted)">${remMonth>=0?fmtH(remMonth)+' u resterend':fmtH(Math.abs(remMonth))+' u te veel'}</span>`
      :`<span class="fc-lbl"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Na deze week: ${remMonth>=0?fmtH(remMonth)+' u over '+remWksF+' wk':fmtH(Math.abs(remMonth))+' u te veel'}</span>${perWk!==null?`<span class="fc-val" style="color:${vc}">${fmtH(perWk)} u/week</span>`:''}`;
    const chips=sortedProjects().map(p=>{
      const bud=getProjBudget(p.id);if(!bud)return'';
      const pu=getProjMonthUsedUpTo(p.id,wIdx,weeks);const bp=Math.min(100,(pu/bud)*100);
      return`<span class="fc-chip ${pu>bud?'over':bp>80?'tight':''}">
        <span class="dot" style="background:${p.color};width:7px;height:7px;flex-shrink:0"></span>
        ${esc(p.name)}: ${fmtH(pu)} / ${fmtH(bud)} u <span style="opacity:.5;font-size:10px">(${bp.toFixed(0)}%)</span>
      </span>`;
    }).filter(Boolean).join('');
    fcHtml=`<div class="fc-row"><div class="fc-main">${mainLine}</div>${chips?`<div class="fc-chips">${chips}</div>`:''}</div>`;
  }

  // GCal import button
  const importBtn=S.gcalConnected?`<button class="import-gcal-btn" data-import="${w.key}" onclick="importWeekFromGcal('${w.key}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Importeer uit Google Agenda</button>`:'';

  // Split per-day table
  let splitSec='';
  if(w.split&&visProjects.length){
    const outMN=w.outM.length?MONTHS[w.outM[0].getMonth()]:'';
    const dTh=(days,cls)=>days.map(d=>{const di=(d.getDay()+6)%7;return`<th class="${cls}" style="min-width:54px">${DAYS[di]}<br><span style="font-weight:400;opacity:.65">${d.getDate()}</span></th>`;}).join('');
    const pRows=visProjects.map(p=>{
      const inC=w.inM.map(d=>{const dk=fmt(d),v=S.projDay[`${dk}|${p.id}`]??'';return`<td><input class="dpi" style="border-color:${ha(p.color,.3)};color:${p.color}" type="number" min="0" step="0.25" value="${v}" placeholder="0" onchange="setProjDayHrs('${dk}','${p.id}',this.value)" onfocus="this.style.boxShadow='0 0 0 2px ${ha(p.color,.25)}'" onblur="this.style.boxShadow='none'"></td>`;}).join('');
      const outC=w.outM.map(d=>{const dk=fmt(d),v=S.projDay[`${dk}|${p.id}`]??'';return`<td><input class="dpi dim" type="number" min="0" step="0.25" value="${v}" placeholder="0" onchange="setProjDayHrs('${dk}','${p.id}',this.value)"></td>`;}).join('');
      const wt=getProjWkHrs(w,p.id);
      return`<tr><td class="pnc"><div style="display:flex;align-items:center;gap:6px"><div class="dot" style="background:${p.color}"></div>${esc(p.name)}</div></td>${inC}${w.outM.length?`<td class="sc"><span class="sep-line"></span></td>${outC}`:''}<td style="text-align:center;font-size:13px;font-weight:700;font-family:'DM Mono',monospace;color:${p.color}">${wt>0?fmtH(wt):'–'}</td></tr>`;
    }).join('');
    const dTotC=days=>days.map(d=>{const t=S.projects.reduce((s,p)=>s+getProjDayHrs(d,p.id),0);return`<td>${t>0?fmtH(t):'–'}</td>`;}).join('');
    const gTot=getTotalWkHrs(w);
    splitSec=`<div class="split-sec"><div class="split-sec-title">✂ Dagelijkse projecturen</div>
      <div class="split-scroll"><table class="sdt">
        <thead><tr><th class="pc">Project</th>${dTh(w.inM,'dm')}${w.outM.length?`<th class="sc"></th>${dTh(w.outM,'do')}`:''}  <th class="tc">Week</th></tr></thead>
        <tbody>${pRows}
          <tr class="tr"><td class="pnc">Dag totaal</td>${dTotC(w.inM)}${w.outM.length?`<td class="sc"></td>${dTotC(w.outM)}`:''}<td>${gTot>0?fmtH(gTot):'–'}</td></tr>
          <tr><td></td><td colspan="${w.inM.length}" style="text-align:center;font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;padding-top:5px">${MONTHS[S.mo]} ↑</td>${w.outM.length?`<td class="sc"></td><td colspan="${w.outM.length}" style="text-align:center;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:5px">${outMN} ↑</td>`:''}<td></td></tr>
        </tbody>
      </table></div>
    </div>`;
  }

  return`<div class="week-card ${w.split?'split':''} ${hasOverrun?'warning':''}">
    ${head}<div class="week-body">${pc}${dayVerifyRow}${absence}${fcHtml}${importBtn}${splitSec}</div>
  </div>`;
}

// ════════ SUMMARY ════════
function rSummary(weeks){
  const total=getMonthTotal(weeks);
  const chips=sortedProjects().map(p=>{
    const bud=getProjBudget(p.id);if(!bud)return'';
    const used=getProjMonthUsedUpTo(p.id,weeks.length-1,weeks);const rem=bud-used;
    return`<div class="sc2-chip" style="border-color:${ha(p.color,.25)}">
      <div style="width:8px;height:8px;border-radius:50%;background:${p.color}"></div>
      <span>${esc(p.name)}:</span>
      <span style="font-weight:700;color:${rem<0?'var(--danger)':rem<bud*.1?'var(--warn)':'var(--ink)'}">${fmtH(used)} / ${fmtH(bud)} u</span>
    </div>`;
  }).filter(Boolean).join('');
  return`<div class="summary">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${chips?'12px':'0'}">
      <div>
        <div style="font-size:15px;font-weight:700;color:var(--success)">Maandtotaal ${MONTHS[S.mo]}</div>
        <div style="font-size:12px;color:var(--accent);margin-top:2px">Gebaseerd op projecturen</div>
      </div>
      <div style="font-size:28px;font-weight:900;color:var(--success);font-family:'DM Mono',monospace">${fmtH(total)}<span style="font-size:14px;font-weight:400"> uur</span></div>
    </div>
    ${chips?`<div class="sc2">${chips}</div>`:''}
  </div>`;
}

// ════════ YEAR ════════
function rYear(){
  const yr=S.chartYr;const sp=sortedProjects();
  const md=Array.from({length:12},(_,mo)=>{
    const wks=weeksOfMonth(yr,mo);const bp={};
    sp.forEach(p=>{bp[p.id]=getProjMonthUsedUpTo(p.id,wks.length-1,wks);});
    return{mo,bp,total:Object.values(bp).reduce((s,v)=>s+v,0)};
  });
  const ap=sp.filter(p=>Array.from({length:12},(_,mo)=>getProjBudget(p.id,yr,mo)+md[mo].bp[p.id]).some(v=>v>0));
  const ytbp={};ap.forEach(p=>{ytbp[p.id]=md.reduce((s,m)=>s+m.bp[p.id],0);});
  const ytot=md.reduce((s,m)=>s+m.total,0);
  const cMo=new Date().getMonth(),cYr=new Date().getFullYear();
  const thC=ap.map(p=>`<th><span class="dot-sm" style="background:${p.color}"></span>${esc(p.name)}</th>`).join('');
  const rows=md.map(({mo,bp,total})=>{
    const isCur=yr===cYr&&mo===cMo;
    const cells=ap.map(p=>{const v=bp[p.id];const bud=getProjBudget(p.id,yr,mo);return`<td class="${isCur?'cur-month':''} ${bud>0&&v>bud?'over-bud':''} ${v===0?'zero':''}">${v>0?fmtH(v):'–'}</td>`;}).join('');
    return`<tr><td class="${isCur?'cur-month':''}">${MONTHS_SHORT[mo]}</td>${cells}<td class="${isCur?'cur-month':''} ${total===0?'zero':''}" style="font-weight:700">${total>0?fmtH(total):'–'}</td></tr>`;
  }).join('');
  const totC=ap.map(p=>`<td style="color:${p.color}">${ytbp[p.id]>0?fmtH(ytbp[p.id]):'–'}</td>`).join('');
  return`<div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px">
      <button class="chart-toggle-btn ${S.showChart?'active':''}" onclick="toggleChart()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>
        ${S.showChart?'Grafiek verbergen':'Grafiek tonen'}
      </button>
    </div>
    ${S.showChart?rChart(ap,md):''}
    <div class="year-table-wrap"><table class="year-table">
      <thead><tr><th>Maand</th>${thC}<th>Totaal</th></tr></thead>
      <tbody>${rows}<tr class="total-row"><td>Totaal</td>${totC}<td style="font-weight:900">${ytot>0?fmtH(ytot):'–'}</td></tr></tbody>
    </table></div>
  </div>`;
}

// ════════ CHART ════════
function rChart(ap,md){
  const vp=ap.filter(p=>S.chartFilter[p.id]!==false);
  const chips=ap.map(p=>{const on=S.chartFilter[p.id]!==false;return`<span class="filter-chip ${on?'on':''}" onclick="toggleProjFilter('${p.id}')" style="${on?`border-color:${ha(p.color,.4)};background:${ha(p.color,.08)}`:''}"><span class="dot" style="background:${on?p.color:'var(--muted)'};width:8px;height:8px"></span>${esc(p.name)}</span>`;}).join('');
  const W=640,H=240,mL=42,mR=12,mT=12,mB=36,cW=W-mL-mR,cH=H-mT-mB,gap=cW/12,bW=Math.floor(gap*.6);
  const maxV=Math.max(...md.map(m=>vp.reduce((s,p)=>s+m.bp[p.id],0)),1);
  const yStep=Math.ceil(maxV/5/5)*5||1,yMax=yStep*5,yScale=cH/yMax;
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:${W}px;display:block">`;
  for(let i=0;i<=5;i++){
    const y=mT+cH-i*yStep*yScale;
    svg+=`<line x1="${mL}" y1="${y}" x2="${mL+cW}" y2="${y}" stroke="var(--border)" stroke-width="${i===0?1.5:.75}"/>`;
    svg+=`<text x="${mL-6}" y="${y+4}" font-size="10" fill="var(--muted)" text-anchor="end" font-family="DM Sans,sans-serif">${i*yStep}</text>`;
  }
  md.forEach(({mo,bp},mi)=>{
    const x=mL+mi*gap+(gap-bW)/2;let sy=mT+cH;
    vp.forEach(p=>{const v=bp[p.id];if(v<=0)return;const bh=v*yScale;sy-=bh;svg+=`<rect x="${x}" y="${sy}" width="${bW}" height="${bh}" fill="${p.color}" rx="2" opacity=".85"/>`;});
    svg+=`<text x="${x+bW/2}" y="${mT+cH+16}" font-size="10" fill="var(--muted)" text-anchor="middle" font-family="DM Sans,sans-serif">${MONTHS_SHORT[mo]}</text>`;
    const tot=vp.reduce((s,p)=>s+bp[p.id],0);
    if(tot>0)svg+=`<text x="${x+bW/2}" y="${mT+cH-tot*yScale-4}" font-size="9" fill="var(--ink)" text-anchor="middle" font-weight="600" font-family="DM Sans,sans-serif">${fmtH(tot)}</text>`;
  });
  svg+=`</svg>`;
  return`<div class="chart-section"><div class="chart-header"><span class="chart-title">Uren per maand — ${S.chartYr}</span><div class="proj-filter">${chips}</div></div><div class="chart-svg-wrap">${svg}</div></div>`;
}

// ════════ START ════════
loadState();
render();
</script>
</body>
</html>
