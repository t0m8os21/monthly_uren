<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urenregistratie</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23c0392b' d='M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async onload="onGsiLoad()"></script>
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg:#f4f3ef; --surface:#fff; --border:#e8e6e0;
  --text:#1a1916; --muted:#8a8780; --ink:#3d3b36;
  --accent:#2d5a3d; --accent-light:#e8f0ea;
  --surface2:#fafaf8; --surface3:#f3f2ee;
  --split-border:#f0c84a; --split-accent:#b07c00;
  --danger:#c0392b; --warn:#d4760a; --success:#2d5a3d;
  --header-bg:#1a1916; --header-fg:#f4f3ef;
  --input-bg:#fff;
}
body.dark {
  --bg:#111010; --surface:#1c1b19; --border:#2e2c28;
  --text:#ede9e2; --muted:#706e68; --ink:#c8c5be;
  --accent:#4d9065; --accent-light:#172318;
  --surface2:#242220; --surface3:#2c2a27;
  --split-border:#8a6a00; --split-accent:#d4960a;
  --danger:#e05545; --warn:#e09030; --success:#4d9065;
  --header-bg:#0e0d0c; --header-fg:#ede9e2;
  --input-bg:#242220;
}
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:20px 16px 40px; transition:background .2s,color .2s; }
.app { max-width:min(1300px, 96vw); width:max-content; min-width:760px; margin:0 auto; }

/* Header */
.header { background:var(--header-bg); color:var(--header-fg); border-radius:14px; padding:18px 22px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.header-center { text-align:center; flex:1; min-width:0; }
.header-month { font-size:21px; font-weight:700; letter-spacing:-.5px; }
.header-meta { margin-top:5px; font-size:13px; opacity:.8; display:flex; gap:14px; justify-content:center; align-items:center; flex-wrap:wrap; }
.header-meta strong { opacity:1; font-weight:600; }
.dv { width:1px; height:12px; background:rgba(255,255,255,.2); display:inline-block; }
.nav-btn,.dark-btn { background:rgba(255,255,255,.1); border:none; color:var(--header-fg); border-radius:9px; cursor:pointer; line-height:1; }
.nav-btn { width:36px; height:36px; font-size:20px; text-align:center; flex-shrink:0; }
.dark-btn { width:32px; height:32px; font-size:16px; display:flex; align-items:center; justify-content:center; border-radius:8px; }
.nav-btn:hover,.dark-btn:hover { background:rgba(255,255,255,.2); }
.tgt-span { cursor:pointer; border-bottom:1px dashed rgba(255,255,255,.4); }
.tgt-input { width:46px; padding:1px 4px; border-radius:5px; border:none; text-align:center; font-weight:700; font-size:13px; font-family:inherit; background:rgba(255,255,255,.18); color:var(--header-fg); }
.view-tabs { display:flex; gap:4px; }
.view-tab { padding:5px 12px; border-radius:7px; border:none; font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; }
.view-tab.active { background:rgba(255,255,255,.25); color:var(--header-fg); }
.view-tab.inactive { background:rgba(255,255,255,.08); color:rgba(255,255,255,.45); }
.view-tab:hover { background:rgba(255,255,255,.2); color:var(--header-fg); }

/* Panels */
.panel { background:var(--surface); border:1.5px solid var(--border); border-radius:10px; margin-bottom:14px; overflow:hidden; }
.ptoggle { width:100%; background:none; border:none; padding:11px 16px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; font-family:inherit; font-size:13px; font-weight:600; color:var(--ink); border-bottom:1.5px solid transparent; }
.ptoggle:hover { background:var(--surface2); }
.ptoggle.open { border-bottom-color:var(--border); }
.ptl { display:flex; align-items:center; gap:8px; }
.pbody { padding:14px 16px; }
.add-row { display:flex; gap:8px; margin-bottom:14px; }
.add-input { flex:1; padding:8px 12px; border-radius:8px; border:1.5px solid var(--border); font-size:13px; font-family:inherit; outline:none; background:var(--input-bg); color:var(--text); }
.add-input:focus { border-color:var(--accent); }
.add-btn { padding:8px 16px; background:var(--ink); color:var(--bg); border:none; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600; font-family:inherit; white-space:nowrap; }
.proj-row { display:grid; grid-template-columns:12px 1fr auto auto auto; gap:10px; align-items:center; padding:8px 10px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface2); margin-bottom:6px; }
.dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; display:inline-block; }
.budget-input { width:58px; padding:5px 6px; border-radius:7px; border:1.5px solid var(--border); text-align:center; font-size:13px; font-weight:600; font-family:'DM Mono',monospace; outline:none; background:var(--input-bg); color:var(--text); }
.del-btn { background:none; border:none; cursor:pointer; color:var(--muted); font-size:15px; padding:0 2px; line-height:1; }
.del-btn:hover { color:var(--danger); }
.data-actions { display:flex; gap:10px; flex-wrap:wrap; }
.data-btn { padding:8px 14px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface2); font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; color:var(--ink); display:flex; align-items:center; gap:6px; }
.data-btn:hover { background:var(--surface3); }
.data-btn.danger { color:var(--danger); }
.data-info { margin-top:10px; font-size:12px; color:var(--muted); line-height:1.6; }
select { background:var(--input-bg); color:var(--text); border:1.5px solid var(--border); padding:8px 10px; border-radius:8px; font-family:inherit; font-size:13px; outline:none; }
.copy-section { margin-top:14px; padding-top:14px; border-top:1.5px solid var(--border); }
.copy-btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.copy-btn { padding:8px 16px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface2); font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; color:var(--ink); }
.copy-btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }

/* Budget summary */
.bsum-table { width:100%; border-collapse:collapse; }
.bsum-table th { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:0 8px 8px; text-align:right; white-space:nowrap; }
.bsum-table th:first-child { text-align:left; }
.bsum-table td { padding:7px 8px; border-top:1px solid var(--border); text-align:right; font-size:13px; font-family:'DM Mono',monospace; white-space:nowrap; }
.bsum-table td:first-child { text-align:left; font-family:'DM Sans',sans-serif; font-weight:500; }
.bsum-table tr.bsum-total td { border-top:1.5px solid var(--border); font-weight:700; background:var(--surface2); }
.bsum-table tr.bsum-total td:first-child { font-family:'DM Sans',sans-serif; }
.bsum-note { font-size:11px; color:var(--muted); margin-top:8px; }

/* Week cards */
.weeks { display:flex; flex-direction:column; gap:10px; }
.week-card { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.week-card.split { border-color:var(--split-border); }
.week-card.warning { border-color:var(--warn); }
.week-head { padding:9px 14px; display:flex; justify-content:space-between; align-items:center; background:var(--surface2); border-bottom:1.5px solid var(--border); cursor:pointer; user-select:none; }
.week-head:hover { background:var(--surface3); }
.week-card.split .week-head { border-bottom-color:var(--split-border); }
.week-card.collapsed .week-head { border-bottom:none; }
.whl { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; flex-wrap:wrap; }
.week-num { color:var(--muted); font-weight:500; }
.week-dates { font-size:12px; color:var(--muted); font-weight:400; }
.split-badge { background:var(--split-accent); color:#fff; font-size:10px; padding:2px 8px; border-radius:20px; font-weight:700; }
.warn-badge { font-size:10px; padding:2px 8px; border-radius:20px; font-weight:700; display:inline-flex; align-items:center; gap:3px; background:rgba(224,144,48,.12); color:var(--warn); border:1px solid var(--warn); }
.abs-badge { font-size:10px; padding:2px 8px; border-radius:20px; color:var(--muted); background:var(--surface3); border:1px solid var(--border); }
.whr { display:flex; gap:10px; align-items:center; font-size:13px; }
.chevron { font-size:11px; color:var(--muted); transition:transform .2s; }
.week-card.collapsed .chevron { transform:rotate(-90deg); }
.week-body { padding:12px 14px; }

/* Unified day table */
.day-table-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.sdt { border-collapse:separate; border-spacing:0; min-width:max-content; }
.sdt th { font-size:10px; font-weight:700; color:var(--muted); padding:0 6px 8px; text-align:center; white-space:nowrap; }
.sdt th.pc { text-align:left; padding-left:2px; text-transform:uppercase; letter-spacing:.05em; min-width:100px; padding-right:10px; }
.sdt th.dm { color:var(--accent); font-size:11px; }
.sdt th.do { color:var(--muted); font-size:11px; }
.sdt th.tc { color:var(--ink); }
.sdt th.ac { text-align:right; padding-right:4px; font-size:9px; white-space:nowrap; max-width:90px; }
.sdt td { padding:4px 5px; vertical-align:middle; }
.sdt td.pnc { font-size:13px; font-weight:500; padding-left:2px; padding-right:10px; white-space:nowrap; }
.sdt td.sc { padding:0 3px; }
.sep-line { display:block; width:1px; min-height:32px; background:linear-gradient(to bottom,transparent,var(--split-border),transparent); margin:0 auto; }
.sdt tr.tr td { border-top:1.5px solid var(--border); padding-top:6px; font-size:11px; font-weight:700; text-align:center; font-family:'DM Mono',monospace; color:var(--ink); }
.sdt tr.tr td.pnc { text-align:left; color:var(--muted); font-family:'DM Sans',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-size:10px; }
.sdt tr.tr td.ac { border-top:1.5px solid var(--border); }
.dpi { width:52px; padding:6px 3px; border-radius:7px; border-width:1.5px; border-style:solid; text-align:center; font-size:12px; font-weight:600; font-family:'DM Mono',monospace; outline:none; display:block; margin:0 auto; background:var(--input-bg); color:var(--text); }
.dpi.dim { border-color:var(--border)!important; color:var(--muted)!important; background:var(--surface2)!important; border-style:dashed!important; box-shadow:none!important; }
.avail-cell { text-align:right; padding-right:4px!important; min-width:88px; }
.avail-main { font-size:13px; font-weight:700; font-family:'DM Mono',monospace; line-height:1.2; }
.avail-sub { font-size:10px; color:var(--muted); margin-top:1px; }

/* Week footer */
.week-footer { margin-top:10px; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.week-bar-wrap { flex:1; min-width:140px; }
.bm { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:4px; }
.bt { height:6px; background:var(--surface3); border-radius:3px; overflow:hidden; }
.bf { height:100%; border-radius:3px; transition:width .3s; }
.absence-wrap { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.absence-label { font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
.abs-grp { display:flex; align-items:center; gap:4px; }
.abs-grp label { font-size:11px; color:var(--muted); white-space:nowrap; }
.abs-inp { width:42px; padding:4px 4px; border-radius:6px; border:1.5px solid var(--border); text-align:center; font-size:11px; font-weight:600; font-family:'DM Mono',monospace; outline:none; background:var(--input-bg); color:var(--text); }
.abs-eff { font-size:11px; color:var(--muted); }

/* Forecast */
.fc-row { margin-top:10px; padding:8px 12px; background:var(--surface2); border-radius:8px; border:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
.fc-lbl { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:5px; }
.fc-val { font-size:14px; font-weight:700; font-family:'DM Mono',monospace; white-space:nowrap; }
.import-gcal-btn { margin-top:10px; display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface2); font-family:inherit; font-size:12px; font-weight:600; color:var(--accent); cursor:pointer; }
.import-gcal-btn:hover { background:var(--surface3); }
.import-gcal-btn:disabled { opacity:.5; cursor:not-allowed; }

/* Year */
.chart-toggle-btn { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:8px; border:1.5px solid var(--border); background:var(--surface); font-family:inherit; font-size:13px; font-weight:600; color:var(--ink); cursor:pointer; }
.chart-toggle-btn:hover { background:var(--surface2); }
.chart-toggle-btn.active { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.year-table-wrap { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; overflow-x:auto; box-shadow:0 2px 8px rgba(0,0,0,.06); margin-bottom:14px; }
.year-table { width:max-content; min-width:100%; border-collapse:collapse; font-size:13px; }
.year-table th { padding:9px 14px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); background:var(--surface2); border-bottom:1.5px solid var(--border); text-align:right; white-space:nowrap; }
.year-table th:first-child { text-align:left; }
.year-table th .dot-sm { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:4px; vertical-align:middle; }
.year-table td { padding:9px 14px; border-bottom:1px solid var(--border); text-align:right; font-family:'DM Mono',monospace; white-space:nowrap; }
.year-table td:first-child { text-align:left; font-family:'DM Sans',sans-serif; font-weight:600; }
.year-table tr:last-child td { border-bottom:none; }
.year-table tr.total-row td { border-top:1.5px solid var(--border); font-weight:700; background:var(--surface2); }
.year-table tr.total-row td:first-child { font-family:'DM Sans',sans-serif; }
.year-table td.cur-month { background:rgba(29,78,216,.08); }
.year-table td.over-bud { color:var(--danger); }
.year-table td.zero { color:var(--muted); }
.chart-section { background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,.06); margin-bottom:14px; }
.chart-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
.proj-filter { display:flex; flex-wrap:wrap; gap:5px; }
.filter-chip { padding:3px 10px; border-radius:20px; border:1.5px solid var(--border); background:var(--surface2); font-size:11px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:5px; color:var(--muted); }
.filter-chip.on { color:var(--ink); }

/* Summary */
.summary { margin-top:14px; padding:16px 20px; background:var(--accent-light); border:1.5px solid var(--accent); border-radius:12px; }
.sc2 { display:flex; flex-wrap:wrap; gap:7px; }
.sc2-chip { display:flex; align-items:center; gap:5px; background:var(--surface); border-radius:20px; padding:4px 11px; font-size:12px; font-weight:500; border:1.5px solid transparent; }

.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 20px; border-radius:30px; font-size:13px; font-weight:500; opacity:0; transition:opacity .3s; pointer-events:none; z-index:999; white-space:nowrap; }
.toast.show { opacity:1; }
.empty-msg { text-align:center; color:var(--muted); font-size:13px; padding:12px 8px; }
.footer { margin-top:12px; font-size:11px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<div class="app" id="app"><div style="padding:60px;text-align:center;color:#9ca3af">Laden…</div></div>
<div class="toast" id="toast"></div>
<script>
const MONTHS=['Januari','Februari','Maart','April','Mei','Juni','Juli','Augustus','September','Oktober','November','December'];
const MONTHS_SHORT=['Jan','Feb','Mrt','Apr','Mei','Jun','Jul','Aug','Sep','Okt','Nov','Dec'];
const DAYS_WK=['Ma','Di','Wo','Do','Vr']; // Mon–Fri only
const COLORS=['#2d5a3d','#1d4ed8','#b07c00','#7c3aed','#be3a2b','#0891b2','#be185d','#4d7c0f'];
const LS_KEY='urenregistratie_v5';
const GCAL_CLIENT_ID='496489196623-41l4utlleu7qs1039seg40uhjc6b99p0.apps.googleusercontent.com';

// ════════ STATE ════════
const _n=new Date();
let S={
  yr:_n.getFullYear(), mo:_n.getMonth(), target:40,
  projects:[{id:'p1',name:'Project 1',color:COLORS[0]}],
  budgets:{},
  projDay:{},    // "YYYY-MM-DD|projId" -> hours  (single source of truth)
  absences:{},   // "weekKey|holiday|vacation|sick" -> hours
  gcalConnected:false, gcalToken:null, gcalMappings:[],
  darkMode:false,
  view:'month', chartYr:_n.getFullYear(), showChart:false, chartFilter:{},
  collapsedWks:{}, showBudgetSummary:true,
  showPanel:false, showData:false, showGcal:false,
  editTarget:false, newName:''
};

// ════════ STORAGE ════════
function loadState(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw){
      // Try migrating from v4
      const v4=localStorage.getItem('urenregistratie_v4');
      if(v4){
        const d=JSON.parse(v4);
        ['target','projects','budgets','projDay','absences','gcalMappings','gcalConnected','darkMode'].forEach(k=>{if(d[k]!==undefined)S[k]=d[k];});
        // Migrate projWeek -> projDay (distribute evenly Mon-Fri)
        if(d.projWeek) migrateFromProjWeek(d.projWeek);
      }
      return;
    }
    const d=JSON.parse(raw);
    ['target','projects','budgets','projDay','absences','gcalMappings','gcalConnected','darkMode'].forEach(k=>{if(d[k]!==undefined)S[k]=d[k];});
    // Migrate projWeek if present in saved data
    if(d.projWeek&&Object.keys(d.projWeek).length) migrateFromProjWeek(d.projWeek);
  }catch(e){console.warn(e);}
}
function migrateFromProjWeek(projWeek){
  for(const [key,hrs] of Object.entries(projWeek)){
    const [weekKey,...rest]=key.split('|');const pid=rest.join('|');
    const n=parseFloat(hrs)||0;if(n<=0)continue;
    const mon=new Date(weekKey);if(isNaN(mon.getTime()))continue;
    const wkdays=Array.from({length:5},(_,i)=>{const d=new Date(mon);d.setDate(d.getDate()+i);return d;});
    const hasData=wkdays.some(d=>S.projDay[`${fmt(d)}|${pid}`]!==undefined);
    if(!hasData){
      const pd=floorQ(n/5);const rem=Math.round((n-pd*5)*4)/4;
      wkdays.forEach((d,i)=>{const v=i===0?pd+rem:pd;if(v>0)S.projDay[`${fmt(d)}|${pid}`]=v;});
    }
  }
}
function saveState(){
  try{
    const {target,projects,budgets,projDay,absences,gcalMappings,gcalConnected,darkMode}=S;
    localStorage.setItem(LS_KEY,JSON.stringify({target,projects,budgets,projDay,absences,gcalMappings,gcalConnected,darkMode}));
  }catch(e){}
}

// ════════ EXPORT/IMPORT ════════
function exportJSON(){
  const d=new Date();
  const {target,projects,budgets,projDay,absences}=S;
  const blob=new Blob([JSON.stringify({exportDatum:d.toISOString(),versie:5,target,projects,budgets,projDay,absences},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`uren-export-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
  a.click();URL.revokeObjectURL(a.href);toast('Exportbestand gedownload ✓');
}
function importJSON(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);if(!d.projects)throw 0;
        ['target','projects','budgets','projDay','absences'].forEach(k=>{if(d[k]!==undefined)S[k]=d[k];});
        if(d.projWeek)migrateFromProjWeek(d.projWeek);
        saveState();render();toast('Data geïmporteerd ✓');
      }catch{alert('Kon het bestand niet importeren.');}
    };r.readAsText(f);
  };inp.click();
}
function clearAllData(){
  if(!confirm('Weet je zeker dat je alle data wilt wissen?'))return;
  S.target=40;S.projects=[{id:'p1',name:'Project 1',color:COLORS[0]}];
  S.budgets={};S.projDay={};S.absences={};saveState();render();toast('Alle data gewist');
}

// ════════ DATE HELPERS ════════
function getMonday(date){const d=new Date(date),day=d.getDay();d.setDate(d.getDate()-(day===0?6:day-1));d.setHours(0,0,0,0);return d;}
function fmt(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function mkey(yr,mo){return`${yr}-${String(mo+1).padStart(2,'0')}`;}
function isoWeek(d){const t=new Date(d);t.setHours(0,0,0,0);t.setDate(t.getDate()+4-(t.getDay()||7));return Math.ceil(((t-new Date(t.getFullYear(),0,1))/864e5+1)/7);}
function weeksOfMonth(yr,mo){
  const first=new Date(yr,mo,1),last=new Date(yr,mo+1,0);const weeks=[];let mon=getMonday(first);
  while(mon<=last){
    const days=Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(d.getDate()+i);return d;});
    const inM=days.filter(d=>d.getMonth()===mo&&d.getFullYear()===yr);
    const outM=days.filter(d=>!(d.getMonth()===mo&&d.getFullYear()===yr));
    weeks.push({mon:new Date(mon),days,inM,outM,split:inM.length<7,key:fmt(mon),wk:isoWeek(mon)});
    mon=new Date(mon);mon.setDate(mon.getDate()+7);
  }
  return weeks;
}
// Mon–Fri days of a week
function wkDays(w){return w.days.slice(0,5);}
// Mon–Fri days that belong to current month view
function wkDaysInMonth(w){return w.split?w.inM.filter(d=>(d.getDay()+6)%7<5):wkDays(w);}

// ════════ CALCULATIONS ════════
function getProjDayHrs(d,pid){return parseFloat(S.projDay[`${fmt(d)}|${pid}`])||0;}
function getProjWkHrs(w,pid){return wkDays(w).reduce((s,d)=>s+getProjDayHrs(d,pid),0);}
function getTotalWkHrs(w){return S.projects.reduce((s,p)=>s+getProjWkHrs(w,p.id),0);}
function getMonthWkHrs(w){return S.projects.reduce((s,p)=>s+wkDaysInMonth(w).reduce((s2,d)=>s2+getProjDayHrs(d,p.id),0),0);}
function getMonthTotal(weeks){return weeks.reduce((s,w)=>s+getMonthWkHrs(w),0);}
function getProjBudget(pid,yr,mo){return parseFloat(S.budgets[mkey(yr??S.yr,mo??S.mo)]?.[pid])||0;}
function getProjMonthUsedUpTo(pid,upToIdx,weeks){
  let t=0;
  for(let i=0;i<=upToIdx;i++){
    t+=wkDaysInMonth(weeks[i]).reduce((s,d)=>s+getProjDayHrs(d,pid),0);
  }
  return t;
}
function getAbsHrs(wk,type){return parseFloat(S.absences[`${wk}|${type}`])||0;}
function getTotalAbsHrs(wk){return['holiday','vacation','sick'].reduce((s,t)=>s+getAbsHrs(wk,t),0);}
function getEffTarget(wk){return Math.max(0,S.target-getTotalAbsHrs(wk));}
function getOverrunPids(wIdx,weeks){
  const at=new Set();
  S.projects.forEach(p=>{
    const bud=getProjBudget(p.id);if(!bud)return;
    const used=getProjMonthUsedUpTo(p.id,wIdx,weeks);
    if(used>0&&(used/(wIdx+1))*weeks.length>bud*1.05)at.add(p.id);
  });
  return at;
}
function getRemainingWeeks(weeks){
  const today=new Date();today.setHours(0,0,0,0);
  for(let i=0;i<weeks.length;i++){const sun=new Date(weeks[i].mon);sun.setDate(sun.getDate()+6);if(sun>=today)return weeks.length-i;}
  return 0;
}

// ════════ GOOGLE CALENDAR ════════
let gcalTokenClient=null;
window.onGsiLoad=function(){
  if(!window.google)return;
  try{gcalTokenClient=google.accounts.oauth2.initTokenClient({client_id:GCAL_CLIENT_ID,scope:'https://www.googleapis.com/auth/calendar.readonly',callback:handleGcalToken});}
  catch(e){console.warn('GSI:',e);}
};
function handleGcalToken(resp){
  if(resp.error){toast('Verbinding mislukt');return;}
  S.gcalToken=resp.access_token;S.gcalConnected=true;saveState();render();toast('Google Agenda verbonden ✓');
}
function connectGcal(){
  if(!window.google){toast('Google bibliotheek laadt nog');return;}
  if(!gcalTokenClient)window.onGsiLoad();
  gcalTokenClient?.requestAccessToken();
}
function disconnectGcal(){
  if(S.gcalToken&&window.google)google.accounts.oauth2.revoke(S.gcalToken,()=>{});
  S.gcalToken=null;S.gcalConnected=false;saveState();render();toast('Ontkoppeld');
}
function addMapping(){
  const kw=document.getElementById('new-kw')?.value?.trim();
  const pid=document.getElementById('new-kw-proj')?.value;
  if(!kw||!pid){toast('Vul zoekterm en project in');return;}
  S.gcalMappings.push({id:`m${Date.now()}`,keyword:kw,projId:pid});saveState();render();
}
function removeMapping(id){S.gcalMappings=S.gcalMappings.filter(m=>m.id!==id);saveState();render();}
function getEventDurHrs(ev){
  if(ev.start?.date||!ev.start?.dateTime)return 0;
  return(new Date(ev.end.dateTime)-new Date(ev.start.dateTime))/3600000;
}
async function importWeekFromGcal(weekKey){
  if(!S.gcalToken){toast('Verbind eerst met Google Agenda');return;}
  if(!S.gcalMappings.length){toast('Voeg koppelingsregels toe');return;}
  const weeks=weeksOfMonth(S.yr,S.mo);const w=weeks.find(x=>x.key===weekKey);if(!w)return;
  const btn=document.querySelector(`[data-import="${weekKey}"]`);
  if(btn){btn.textContent='⏳ Laden…';btn.disabled=true;}
  const tMin=encodeURIComponent(w.mon.toISOString());
  const tMax=encodeURIComponent(new Date(w.mon.getTime()+7*864e5).toISOString());
  let events=[];
  try{
    const resp=await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${tMin}&timeMax=${tMax}&singleEvents=true&orderBy=startTime&maxResults=250`,{headers:{Authorization:`Bearer ${S.gcalToken}`}});
    if(resp.status===401){S.gcalConnected=false;S.gcalToken=null;saveState();render();toast('Sessie verlopen, verbind opnieuw');return;}
    events=(await resp.json()).items||[];
  }catch{toast('Fout bij ophalen agenda');render();return;}
  let matched=0;
  for(const ev of events){
    const title=(ev.summary||'').toLowerCase();
    const rule=S.gcalMappings.find(m=>title.includes(m.keyword.toLowerCase()));
    if(!rule)continue;const dur=floorQ(getEventDurHrs(ev));if(dur<=0)continue;
    if(!ev.start?.dateTime)continue;
    const d=new Date(ev.start.dateTime);
    const dayIdx=(d.getDay()+6)%7;if(dayIdx>=5)continue; // skip weekends
    const dk=fmt(d);const k=`${dk}|${rule.projId}`;
    S.projDay[k]=(parseFloat(S.projDay[k])||0)+dur;matched++;
  }
  if(!matched){toast('Geen overeenkomsten gevonden');render();return;}
  saveState();render();toast(`${matched} event${matched!==1?'s':''} geïmporteerd ✓`);
}

// ════════ UTILS ════════
let _tt;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),2800);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function ha(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}
function sortedProjects(){return[...S.projects].sort((a,b)=>a.name.localeCompare(b.name,'nl'));}
function floorQ(v){return Math.floor(v*4)/4;}
function fmtH(v){const n=Number(v);if(isNaN(n))return'–';return n%1===0?n.toFixed(0):n.toFixed(2).replace(/\.?0+$/,'');}
function nextMonthName(){const m=S.mo===11?0:S.mo+1,y=S.mo===11?S.yr+1:S.yr;return`${MONTHS[m]} ${y}`;}

// ════════ RENDER ════════
function render(){
  applyDark();

  const monthTot=getMonthTotal(weeks);
  const cm=mkey(S.yr,S.mo);
  const isMonth=S.view==='month';
  document.getElementById('app').innerHTML=
    rHeader(monthTot,isMonth)+
    rGcalPanel(cm,weeks)+rProjPanel(cm,weeks)+rDataPanel()+

      ? rBudgetSummary(weeks)+`<div class="weeks">${weeks.map((w,i)=>rWeek(w,weeks,i)).join('')}</div>`+rSummary(weeks)

    )+`<div class="footer">Data wordt automatisch opgeslagen · Klik op weekdoel om aan te passen</div>`;

}

// ════════ BUDGET SUMMARY ════════
function rBudgetSummary(weeks){
  const sp=sortedProjects().filter(p=>getProjBudget(p.id)>0);
  if(!sp.length)return'';
  const remWks=getRemainingWeeks(weeks);
  const totalUsed=getMonthTotal(weeks);
  const totalBud=sp.reduce((s,p)=>s+getProjBudget(p.id),0);
  const totalRem=totalBud-totalUsed;
  const totalAbsThisMo=weeks.reduce((s,w)=>s+getTotalAbsHrs(w.key),0);
  let body='';
  if(S.showBudgetSummary){
    const rows=sp.map(p=>{
      const bud=getProjBudget(p.id);const used=getProjMonthUsedUpTo(p.id,weeks.length-1,weeks);
      const rem=bud-used;const ppw=remWks>0?floorQ(rem/remWks):null;
      const rc=rem<0?'var(--danger)':ppw!==null&&ppw<(bud/weeks.length)*.5?'var(--warn)':'var(--success)';
      return`<tr>
        <td><div style="display:flex;align-items:center;gap:7px"><div class="dot" style="background:${p.color}"></div>${esc(p.name)}</div></td>
        <td style="color:var(--muted)">${fmtH(bud)} u</td>
        <td>${fmtH(used)} u</td>
        <td style="color:${rem<0?'var(--danger)':'var(--text)'}">${fmtH(rem)} u</td>
        <td style="font-weight:700;color:${rc}">${ppw!==null?fmtH(ppw)+' u/wk':'–'}</td>
      </tr>`;
    }).join('');
    body=`<div class="pbody" style="padding-bottom:12px">
      <table class="bsum-table">
        <thead><tr><th>Project</th><th>Budget</th><th>Gebruikt</th><th>Resterend</th><th>Per week*</th></tr></thead>
        <tbody>${rows}
          <tr class="bsum-total">
            <td>Totaal</td>
            <td style="color:var(--muted)">${fmtH(totalBud)} u</td>
            <td>${fmtH(totalUsed)} u</td>
            <td style="color:${totalRem<0?'var(--danger)':'var(--text)'}">${fmtH(totalRem)} u</td>
            <td style="color:${totalRem<0?'var(--danger)':'var(--success)'};font-weight:700">${remWks>0?fmtH(floorQ(totalRem/remWks))+' u/wk':'–'}</td>
          </tr>
        </tbody>
      </table>
      <div class="bsum-note">* Afgerond naar beneden op kwartier · ${remWks} resterende week${remWks!==1?'en':''}${totalAbsThisMo>0?` · ${fmtH(totalAbsThisMo)} u afwezigheid verrekend`:''}</div>
    </div>`;
  }
  return`<div class="panel" style="border-color:var(--accent)">
    <button class="ptoggle ${S.showBudgetSummary?'open':''}" onclick="S.showBudgetSummary=!S.showBudgetSummary;render()" style="${S.showBudgetSummary?'background:var(--accent-light)':''}">
      <div class="ptl">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        <span style="color:var(--success);font-weight:700">Budgetoverzicht — ${MONTHS[S.mo]}</span>
        <span style="font-size:11px;color:var(--muted);font-weight:400">${fmtH(totalUsed)} / ${fmtH(totalBud)} u</span>
      </div><span>${S.showBudgetSummary?'▲':'▼'}</span>
    </button>${body}
  </div>`;
}

  let body='';
  if(S.showData){
    const raw=localStorage.getItem(LS_KEY);const kb=raw?(new Blob([raw]).size/1024).toFixed(1):'0';
    body=`<div class="pbody">
      <div class="data-actions">
        <button class="data-btn" onclick="exportJSON()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Exporteer JSON</button>
        <button class="data-btn" onclick="importJSON()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>Importeer JSON</button>
        <button class="data-btn danger" onclick="clearAllData()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>Alles wissen</button>
      </div>
      <div class="data-info">Opgeslagen in browser · ${kb} KB · <strong>Export:</strong> JSON-backup · <strong>Import:</strong> herstel <em>(overschrijft data)</em></div>
    </div>`;
  }
  return`<div class="panel">
    <button class="ptoggle ${S.showData?'open':''}" onclick="S.showData=!S.showData;render()">
      <div class="ptl"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>Data &amp; Back-up</div>
      <span>${S.showData?'▲':'▼'}</span>
    </button>${body}
  </div>`;
}

// ════════ WEEK CARD ════════
function rWeek(w,weeks,wIdx){
  const collapsed=!!S.collapsedWks[w.key];
  const totalHrs=getTotalWkHrs(w);
  const absHrs=getTotalAbsHrs(w.key);
  const effTarget=getEffTarget(w.key);
  const rem=effTarget-totalHrs;
  const pct=Math.min(100,effTarget>0?(totalHrs/effTarget)*100:0);
  const rc=rem<0?'var(--danger)':rem===0?'var(--success)':'var(--ink)';
  const dr=`${w.inM[0].getDate()} – ${w.inM[w.inM.length-1].getDate()} ${MONTHS[S.mo]}`;
  const rs=rem>0?`Nog ${fmtH(rem)} u`:rem<0?`${fmtH(Math.abs(rem))} u over`:'✓ Compleet';
  const overrunPids=getOverrunPids(wIdx,weeks);
  const hasOverrun=overrunPids.size>0;
  const remWks=weeks.length-(wIdx+1);
  const visProjects=sortedProjects().filter(p=>getProjBudget(p.id)>0);

  const head=`<div class="week-head" onclick="toggleWk('${w.key}')">
    <div class="whl">
      <span class="week-num">Week ${w.wk}</span>
      <span class="week-dates">${dr}</span>
      ${w.split?`<span class="split-badge">✂ Gesplitst</span>`:''}
      ${absHrs>0?`<span class="abs-badge">${fmtH(absHrs)} u afwezigheid</span>`:''}
      ${hasOverrun?`<span class="warn-badge">⚠ dreigt over budget</span>`:''}
    </div>
    <div class="whr">
      <span style="color:var(--muted);font-size:13px"><strong style="color:var(--ink)">${fmtH(totalHrs)}</strong> / ${fmtH(effTarget)} u</span>
      <span style="font-weight:700;color:${rc}">${rs}</span>
      <span class="chevron">▼</span>
    </div>
  </div>`;

  if(collapsed)return`<div class="week-card ${w.split?'split':''} ${hasOverrun?'warning':''} collapsed">${head}</div>`;

  // ── Build the unified Mon-Fri per-project table ──
  const weekdays=wkDays(w); // exactly Mon–Fri

  // Find separator index for split weeks (where month changes between consecutive days)
  let sepIdx=-1;
  if(w.split){
    for(let i=0;i<weekdays.length-1;i++){
      if(weekdays[i].getMonth()!==weekdays[i+1].getMonth()){sepIdx=i;break;}
    }
  }

  // Column headers
  const colHeads=weekdays.map((d,i)=>{
    const isActive=!w.split||w.inM.some(x=>fmt(x)===fmt(d));
    const cls=isActive?'dm':'do';
    const afterSep=sepIdx===i?`<th class="sc" style="width:10px"></th>`:'';
    return`<th class="${cls}" style="min-width:58px">${DAYS_WK[i]}<br><span style="font-weight:400;opacity:.7;font-size:9px">${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}</span></th>${afterSep}`;
  }).join('');

  let tableContent='';
  if(!visProjects.length){
    tableContent=`<div class="empty-msg">${!S.projects.length?'Voeg projecten toe via het paneel hierboven.':'Stel een maandbudget in om uren in te vullen.'}</div>`;
  } else {
    // Project rows
    const projRows=visProjects.map(p=>{
      const wkH=getProjWkHrs(w,p.id);
      const used=getProjMonthUsedUpTo(p.id,wIdx,weeks);
      const bud=getProjBudget(p.id);const rb=bud-used;
      const ppw=bud>0&&remWks>0?floorQ(rb/remWks):null;
      const isOver=overrunPids.has(p.id);
      const ac=rb<0?'var(--danger)':ppw!==null&&ppw<(bud/weeks.length)*.5?'var(--warn)':'var(--success)';

      const cells=weekdays.map((d,i)=>{
        const isActive=!w.split||w.inM.some(x=>fmt(x)===fmt(d));
        const dk=fmt(d);const v=S.projDay[`${dk}|${p.id}`]??'';
        const inp=isActive
          ?`<input class="dpi" style="border-color:${ha(p.color,.3)};color:${p.color}"
              type="number" min="0" step="0.25" value="${v}" placeholder="0"
              onchange="setProjDayHrs('${dk}','${p.id}',this.value)"
              onfocus="this.style.boxShadow='0 0 0 2px ${ha(p.color,.22)}'" onblur="this.style.boxShadow='none'">`
          :`<input class="dpi dim" type="number" min="0" step="0.25" value="${v}" placeholder="0"
              onchange="setProjDayHrs('${dk}','${p.id}',this.value)">`;
        const afterSep=sepIdx===i?`<td class="sc"><span class="sep-line"></span></td>`:'';
        return`<td>${inp}</td>${afterSep}`;
      }).join('');

      const availCell=bud>0
        ?`<td class="avail-cell" style="background:${isOver?'rgba(224,144,48,.06)':''}">
            <div class="avail-main" style="color:${isOver?'var(--warn)':ac}">
              ${ppw!==null?fmtH(ppw)+' u/wk':rb>=0?fmtH(rb)+' u':fmtH(Math.abs(rb))+' te veel'}
              ${isOver?'⚠':''}
            </div>
            <div class="avail-sub">${fmtH(rb)} u · ${remWks} wk</div>
          </td>`
        :`<td class="avail-cell"><span style="font-size:11px;color:var(--muted)">–</span></td>`;

      return`<tr style="${isOver?'background:rgba(224,144,48,.04)':''}">
        <td class="pnc"><div style="display:flex;align-items:center;gap:7px"><div class="dot" style="background:${p.color}"></div>${esc(p.name)}</div></td>
        ${cells}
        <td style="text-align:center;font-size:13px;font-weight:700;font-family:'DM Mono',monospace;color:${p.color}">${wkH>0?fmtH(wkH):'–'}</td>
        ${availCell}
      </tr>`;
    }).join('');

    // Day total row
    const dayTotCells=weekdays.map((d,i)=>{
      const t=S.projects.reduce((s,p)=>s+getProjDayHrs(d,p.id),0);
      const afterSep=sepIdx===i?`<td class="sc"></td>`:'';
      return`<td>${t>0?fmtH(t):'–'}</td>${afterSep}`;
    }).join('');
    const totRow=`<tr class="tr">
      <td class="pnc">Dag totaal</td>${dayTotCells}
      <td>${totalHrs>0?fmtH(totalHrs):'–'}</td>
      <td class="ac"></td>
    </tr>`;

    // Month label row (split weeks only)
    let moLblRow='';
    if(w.split&&sepIdx>=0){
      const inMWkCount=weekdays.filter(d=>w.inM.some(x=>fmt(x)===fmt(d))).length;
      const outMWkCount=weekdays.length-inMWkCount;
      const firstIsIn=w.inM.some(x=>fmt(x)===fmt(weekdays[0]));
      const inMN=MONTHS[S.mo];const outMN=MONTHS[w.outM[0].getMonth()];
      moLblRow=firstIsIn
        ?`<tr><td></td><td colspan="${inMWkCount}" style="text-align:center;font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;padding-top:4px">${inMN} ↑</td><td class="sc"></td><td colspan="${outMWkCount}" style="text-align:center;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:4px">${outMN} ↑</td><td></td><td></td></tr>`
        :`<tr><td></td><td colspan="${outMWkCount}" style="text-align:center;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:4px">${outMN} ↑</td><td class="sc"></td><td colspan="${inMWkCount}" style="text-align:center;font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;padding-top:4px">${inMN} ↑</td><td></td><td></td></tr>`;
    }

    tableContent=`<div class="day-table-scroll"><table class="sdt">
      <thead><tr>
        <th class="pc">Project</th>
        ${colHeads}
        <th class="tc">Week</th>
        <th class="ac">Beschikb./wk</th>
      </tr></thead>
      <tbody>${projRows}${totRow}${moLblRow}</tbody>
    </table></div>`;
  }

  // Progress bar + absence row
  const footer=`<div class="week-footer" style="margin-top:10px">
    <div class="week-bar-wrap">
      <div class="bm">
        <span>${fmtH(totalHrs)} u van ${fmtH(effTarget)} u${absHrs>0?` (${S.target} – ${fmtH(absHrs)} afwezigheid)`:''}</span>
        <span>${pct.toFixed(0)}%</span>
      </div>
      <div class="bt"><div class="bf" style="width:${pct}%;background:${totalHrs>=effTarget?'var(--success)':'var(--ink)'}"></div></div>
    </div>
    <div class="absence-wrap">
      <span class="absence-label">Afwezigheid</span>
      <div class="abs-grp"><span>🏛</span><label>Feestdag</label>
        <input class="abs-inp" type="number" min="0" step="0.25" value="${S.absences[`${w.key}|holiday`]??''}" placeholder="0" onchange="setAbsence('${w.key}','holiday',this.value)"> u</div>
      <div class="abs-grp"><span>✈</span><label>Vakantie</label>
        <input class="abs-inp" type="number" min="0" step="0.25" value="${S.absences[`${w.key}|vacation`]??''}" placeholder="0" onchange="setAbsence('${w.key}','vacation',this.value)"> u</div>
      <div class="abs-grp"><span>🤒</span><label>Ziek</label>
        <input class="abs-inp" type="number" min="0" step="0.25" value="${S.absences[`${w.key}|sick`]??''}" placeholder="0" onchange="setAbsence('${w.key}','sick',this.value)"> u</div>
      ${absHrs>0?`<span class="abs-eff">→ effectief ${fmtH(effTarget)} u</span>`:''}
    </div>
  </div>`;

  // Forecast
  const mBud=S.target*weeks.length;
  const usedSoFar=weeks.slice(0,wIdx+1).reduce((s,wk)=>s+getMonthWkHrs(wk),0);
  const remMonth=mBud-usedSoFar;const remWksF=weeks.length-(wIdx+1);const perWk=remWksF>0?remMonth/remWksF:null;
  const vc=perWk===null?'var(--muted)':perWk<0?'var(--danger)':perWk<S.target*.6?'var(--warn)':'var(--success)';
  const fcHtml=S.projects.length?`<div class="fc-row">
    ${remWksF===0
      ?`<span class="fc-lbl">Laatste week</span><span class="fc-val" style="color:var(--muted)">${fmtH(Math.abs(remMonth))} u ${remMonth>=0?'resterend':'te veel'}</span>`
      :`<span class="fc-lbl">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Na deze week: ${fmtH(Math.abs(remMonth))} u ${remMonth>=0?'resterend':'te veel'} · ${remWksF} wk
        </span>
        ${perWk!==null?`<span class="fc-val" style="color:${vc}">${fmtH(perWk)} u/wk</span>`:''}`
    }
  </div>`:'' ;

  const importBtn=S.gcalConnected?`<button class="import-gcal-btn" data-import="${w.key}" onclick="importWeekFromGcal('${w.key}')">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Importeer uit Google Agenda</button>`:'';

  return`<div class="week-card ${w.split?'split':''} ${hasOverrun?'warning':''}">
    ${head}
    <div class="week-body">${tableContent}${footer}${fcHtml}${importBtn}</div>
  </div>`;
}

// ════════ SUMMARY ════════
function rSummary(weeks){
  const total=getMonthTotal(weeks);
  const chips=sortedProjects().map(p=>{
    const bud=getProjBudget(p.id);if(!bud)return'';
    const used=getProjMonthUsedUpTo(p.id,weeks.length-1,weeks);const rem=bud-used;
    return`<div class="sc2-chip" style="border-color:${ha(p.color,.25)}">
      <div class="dot" style="background:${p.color}"></div>
      <span>${esc(p.name)}:</span>
      <span style="font-weight:700;color:${rem<0?'var(--danger)':rem<bud*.1?'var(--warn)':'var(--ink)'}">${fmtH(used)} / ${fmtH(bud)} u</span>
    </div>`;
  }).filter(Boolean).join('');
  return`<div class="summary">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${chips?'12px':'0'}">
      <div>
        <div style="font-size:15px;font-weight:700;color:var(--success)">Maandtotaal ${MONTHS[S.mo]}</div>
        <div style="font-size:12px;color:var(--accent);margin-top:2px">Gebaseerd op dagelijkse projecturen</div>
      </div>
      <div style="font-size:28px;font-weight:900;color:var(--success);font-family:'DM Mono',monospace">${fmtH(total)}<span style="font-size:14px;font-weight:400"> uur</span></div>
    </div>
    ${chips?`<div class="sc2">${chips}</div>`:''}
  </div>`;
}

// ════════ YEAR ════════
function rYear(){
  const yr=S.chartYr;const sp=sortedProjects();
  const md=Array.from({length:12},(_,mo)=>{
    const wks=weeksOfMonth(yr,mo);const bp={};
    sp.forEach(p=>{bp[p.id]=getProjMonthUsedUpTo(p.id,wks.length-1,wks);});
    return{mo,bp,total:Object.values(bp).reduce((s,v)=>s+v,0)};
  });
  const ap=sp.filter(p=>Array.from({length:12},(_,mo)=>getProjBudget(p.id,yr,mo)+md[mo].bp[p.id]).some(v=>v>0));
  const ytbp={};ap.forEach(p=>{ytbp[p.id]=md.reduce((s,m)=>s+m.bp[p.id],0);});
  const ytot=md.reduce((s,m)=>s+m.total,0);
  const cMo=new Date().getMonth(),cYr=new Date().getFullYear();
  const thC=ap.map(p=>`<th><span class="dot-sm" style="background:${p.color}"></span>${esc(p.name)}</th>`).join('');
  const rows=md.map(({mo,bp,total})=>{
    const isCur=yr===cYr&&mo===cMo;
    const cells=ap.map(p=>{const v=bp[p.id];const bud=getProjBudget(p.id,yr,mo);return`<td class="${isCur?'cur-month':''} ${bud>0&&v>bud?'over-bud':''} ${v===0?'zero':''}">${v>0?fmtH(v):'–'}</td>`;}).join('');
    return`<tr><td class="${isCur?'cur-month':''}">${MONTHS_SHORT[mo]}</td>${cells}<td class="${isCur?'cur-month':''} ${total===0?'zero':''}" style="font-weight:700">${total>0?fmtH(total):'–'}</td></tr>`;
  }).join('');
  const totC=ap.map(p=>`<td style="color:${p.color}">${ytbp[p.id]>0?fmtH(ytbp[p.id]):'–'}</td>`).join('');
  return`<div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px">
      <button class="chart-toggle-btn ${S.showChart?'active':''}" onclick="toggleChart()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>
        ${S.showChart?'Grafiek verbergen':'Grafiek tonen'}
      </button>
    </div>
    ${S.showChart?rChart(ap,md):''}
    <div class="year-table-wrap"><table class="year-table">
      <thead><tr><th>Maand</th>${thC}<th>Totaal</th></tr></thead>
      <tbody>${rows}<tr class="total-row"><td>Totaal</td>${totC}<td style="font-weight:900">${ytot>0?fmtH(ytot):'–'}</td></tr></tbody>
    </table></div>
  </div>`;
}

// ════════ CHART ════════
function rChart(ap,md){
  const vp=ap.filter(p=>S.chartFilter[p.id]!==false);
  const chips=ap.map(p=>{const on=S.chartFilter[p.id]!==false;return`<span class="filter-chip ${on?'on':''}" onclick="toggleProjFilter('${p.id}')" style="${on?`border-color:${ha(p.color,.4)};background:${ha(p.color,.08)}`:''}"><span class="dot" style="background:${on?p.color:'var(--muted)'};width:8px;height:8px"></span>${esc(p.name)}</span>`;}).join('');
  const W=640,H=240,mL=42,mR=12,mT=12,mB=36,cW=W-mL-mR,cH=H-mT-mB,gap=cW/12,bW=Math.floor(gap*.6);
  const maxV=Math.max(...md.map(m=>vp.reduce((s,p)=>s+m.bp[p.id],0)),1);
  const yStep=Math.ceil(maxV/5/5)*5||1,yMax=yStep*5,yScale=cH/yMax;
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:${W}px;display:block">`;
  for(let i=0;i<=5;i++){
    const y=mT+cH-i*yStep*yScale;
    svg+=`<line x1="${mL}" y1="${y}" x2="${mL+cW}" y2="${y}" stroke="var(--border)" stroke-width="${i===0?1.5:.75}"/>`;
    svg+=`<text x="${mL-6}" y="${y+4}" font-size="10" fill="var(--muted)" text-anchor="end" font-family="DM Sans,sans-serif">${i*yStep}</text>`;
  }
  md.forEach(({mo,bp},mi)=>{
    const x=mL+mi*gap+(gap-bW)/2;let sy=mT+cH;
    vp.forEach(p=>{const v=bp[p.id];if(!v)return;const bh=v*yScale;sy-=bh;svg+=`<rect x="${x}" y="${sy}" width="${bW}" height="${bh}" fill="${p.color}" rx="2" opacity=".85"/>`;});
    svg+=`<text x="${x+bW/2}" y="${mT+cH+16}" font-size="10" fill="var(--muted)" text-anchor="middle" font-family="DM Sans,sans-serif">${MONTHS_SHORT[mo]}</text>`;
    const tot=vp.reduce((s,p)=>s+bp[p.id],0);
    if(tot>0)svg+=`<text x="${x+bW/2}" y="${mT+cH-tot*yScale-4}" font-size="9" fill="var(--ink)" text-anchor="middle" font-weight="600" font-family="DM Sans,sans-serif">${fmtH(tot)}</text>`;
  });
  svg+=`</svg>`;
  return`<div class="chart-section"><div class="chart-header"><span style="font-size:13px;font-weight:700">Uren per maand — ${S.chartYr}</span><div class="proj-filter">${chips}</div></div><div style="width:100%;overflow-x:auto">${svg}</div></div>`;
}

// ════════ START ════════
loadState();
render();
</script>
